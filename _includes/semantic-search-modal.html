<!-- Semantic Search Modal -->
<div id="semantic-search-modal" class="ai-modal" role="dialog" aria-labelledby="modal-title" aria-hidden="true">
  <div class="ai-modal__overlay" data-close-modal></div>
  <div class="ai-modal__container">
    <div class="ai-modal__header">
      <h2 id="modal-title" class="ai-modal__title">
        <svg class="ai-modal__icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="M21 21l-4.35-4.35"></path>
          <path d="M11 8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"></path>
        </svg>
        Semantic Search
      </h2>
      <button class="ai-modal__close" data-close-modal aria-label="Close modal">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6L6 18M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <div class="ai-modal__body">
      <!-- Search Mode Toggle -->
      <div class="search-mode-toggle">
        <button class="mode-btn active" data-mode="hybrid" title="Hybrid Search (Keyword + Vector)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          Hybrid
        </button>
        <button class="mode-btn" data-mode="vector" title="Vector Search (Semantic)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"></path>
            <path d="M12 6v6l4 2"></path>
          </svg>
          Vector
        </button>
        <button class="mode-btn" data-mode="keyword" title="Keyword Search (Traditional)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16v16H4z"></path>
            <path d="M8 8h8M8 12h8M8 16h4"></path>
          </svg>
          Keyword
        </button>
      </div>

      <!-- Search Input -->
      <div class="search-input-container">
        <input 
          type="text" 
          id="semantic-search-input" 
          class="search-input" 
          placeholder="Ask in natural language... (e.g., 'How do I optimize React performance?')"
          autocomplete="off"
          spellcheck="false"
        />
        <div class="search-status" id="search-status">
          <span class="status-indicator"></span>
          <span class="status-text">Ready</span>
        </div>
      </div>

      <!-- Results Container -->
      <div class="search-results" id="search-results">
        <!-- Skeleton loader -->
        <div class="results-skeleton" id="results-skeleton" hidden>
          <div class="skeleton-item"></div>
          <div class="skeleton-item"></div>
          <div class="skeleton-item"></div>
        </div>

        <!-- Results will be injected here -->
        <div class="results-placeholder" id="results-placeholder">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="M21 21l-4.35-4.35"></path>
          </svg>
          <p>Enter your query to find semantically relevant content</p>
        </div>
      </div>
    </div>

    <div class="ai-modal__footer">
      <div class="search-info">
        <span class="info-label">Model:</span>
        <span class="info-value" id="model-info">all-MiniLM-L6-v2</span>
        <span class="info-divider">|</span>
        <span class="info-label">Index:</span>
        <span class="info-value" id="index-info">0 posts</span>
      </div>
    </div>
  </div>
</div>

<!-- Result Item Template (for JS rendering) -->
<template id="result-item-template">
  <article class="search-result-item">
    <div class="result-header">
      <h3 class="result-title"></h3>
      <div class="relevance-badge">
        <span class="relevance-score"></span>
        <span class="relevance-label">Relevance</span>
      </div>
    </div>
    <p class="result-excerpt"></p>
    <div class="result-meta">
      <span class="result-date"></span>
      <span class="result-category"></span>
    </div>
    <a class="result-link" href="#">Read more →</a>
  </article>
</template>

<!-- AI Assistant Widget -->
<div id="ai-assistant-widget" class="ai-widget" role="complementary" aria-label="AI Assistant">
  <!-- Widget Toggle Button -->
  <button 
    class="ai-widget__toggle" 
    id="ai-widget-toggle" 
    aria-expanded="false" 
    aria-controls="ai-widget-chat"
    title="Open AI Assistant"
  >
    <svg class="icon-default" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    </svg>
    <svg class="icon-close" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" hidden>
      <path d="M18 6L6 18M6 6l12 12"></path>
    </svg>
    <span class="status-dot" id="widget-status-dot" data-status="ready"></span>
  </button>

  <!-- Chat Container -->
  <div class="ai-widget__chat" id="ai-widget-chat" hidden>
    <!-- Chat Header -->
    <div class="chat-header">
      <div class="chat-title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1v-1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"></path>
          <path d="M9 12a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"></path>
          <path d="M15 12a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"></path>
        </svg>
        <span>AI Assistant</span>
      </div>
      <div class="chat-actions">
        <button class="action-btn" id="chat-context-menu" title="Context Menu" aria-label="Context Menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="1"></circle>
            <circle cx="12" cy="5" r="1"></circle>
            <circle cx="12" cy="19" r="1"></circle>
          </svg>
        </button>
        <button class="action-btn" id="chat-clear" title="Clear Chat" aria-label="Clear Chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Model Status Indicator -->
    <div class="model-status" id="model-status">
      <span class="status-indicator"></span>
      <span class="status-text">Model: Loading...</span>
    </div>

    <!-- Messages Container -->
    <div class="chat-messages" id="chat-messages" role="log" aria-live="polite">
      <!-- Welcome Message -->
      <div class="message assistant-message">
        <div class="message-avatar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1v-1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"></path>
          </svg>
        </div>
        <div class="message-content">
          <p>Hello! I'm your AI assistant. I can help you navigate this blog, answer questions about the content, or provide summaries. Try asking me something!</p>
          <p class="message-hints">
            <code>/clear</code> - Clear chat history<br>
            <code>/context</code> - Show current page context<br>
            <code>/summary</code> - Summarize current article
          </p>
        </div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="chat-input-area">
      <textarea 
        id="chat-input" 
        class="chat-input" 
        placeholder="Type your message... (Shift+Enter for new line)"
        rows="2"
        aria-label="Chat input"
      ></textarea>
      <button 
        class="send-btn" 
        id="chat-send" 
        aria-label="Send message"
        disabled
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"></path>
        </svg>
      </button>
    </div>

    <!-- Context Menu (Hidden by default) -->
    <div class="context-menu" id="context-menu" hidden>
      <button class="context-menu-item" data-action="summarize">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"></path>
        </svg>
        Summarize Page
      </button>
      <button class="context-menu-item" data-action="explain">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
          <path d="M12 17h.01"></path>
        </svg>
        Explain Concept
      </button>
      <button class="context-menu-item" data-action="related">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <path d="M15 3h6v6M10 14L21 3"></path>
        </svg>
        Find Related Posts
      </button>
      <button class="context-menu-item" data-action="language">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
        Change Language
      </button>
    </div>
  </div>
</div>

<!-- Message Templates (for JS rendering) -->
<template id="user-message-template">
  <div class="message user-message">
    <div class="message-content"></div>
    <div class="message-avatar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
    </div>
  </div>
</template>

<template id="assistant-message-template">
  <div class="message assistant-message">
    <div class="message-avatar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1v-1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"></path>
      </svg>
    </div>
    <div class="message-content"></div>
  </div>
</template>

<template id="loading-message-template">
  <div class="message assistant-message loading">
    <div class="message-avatar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1v-1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"></path>
      </svg>
    </div>
    <div class="message-content">
      <div class="typing-indicator">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </div>
</template>

<header class="sticky top-0 z-50 border-b bg-background/80 backdrop-blur-md" role="banner">
  <div class="container-wide flex h-16 items-center justify-between gap-4">
    <!-- Logo/Home link -->
    <a class="site-title group flex items-center gap-2.5" href="{{ '/' | absolute_url }}"
       aria-label="{{ site.title | escape }} - {{ site.description | escape }}">
      <span class="flex h-8 w-8 items-center justify-center rounded-lg border bg-surface font-mono text-sm font-bold text-primary">DI</span>
      <span class="site-logo font-mono text-sm font-semibold tracking-tight text-foreground" data-i18n="site.title">{{ site.title }}</span>
    </a>

    <!-- Desktop Navigation -->
    <nav class="site-nav flex items-center gap-1" role="navigation" aria-label="Основная навигация">
      <div class="nav-desktop hidden items-center gap-1 md:flex">
        {% for item in site.navigation %}
          <a class="nav-link {% if page.url == item.url %}active{% endif %}"
             href="{{ item.url | absolute_url }}"
             data-i18n="navigation.{{ item.name | downcase | replace: ' ', '_' }}">
            {{ item.name }}
          </a>
        {% endfor %}
      </div>

      <div class="mx-1 hidden h-5 w-px bg-border md:block"></div>

      <!-- Semantic Search trigger (Vector B) -->
      <button class="search-trigger" type="button" aria-label="Открыть семантический поиск" data-open-semantic-search>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="M21 21l-4.35-4.35"></path>
        </svg>
        <span class="hidden sm:inline" data-i18n="navigation.search">Поиск</span>
        <kbd class="search-trigger__kbd">Alt K</kbd>
      </button>

      <!-- Theme Toggle (rendered by theme-manager JS) -->
      <div class="theme-toggle theme-toggle--header"></div>

      <!-- Mobile Menu Toggle -->
      <button class="mobile-toggle inline-flex h-9 w-9 items-center justify-center rounded-lg border bg-surface text-muted transition-colors hover:text-foreground md:hidden"
              type="button"
              aria-label="Переключить меню навигации"
              aria-expanded="false"
              aria-controls="mobile-menu"
              data-mobile-toggle>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </nav>
  </div>

  <!-- Mobile Navigation -->
  <div id="mobile-menu" class="hidden border-t bg-surface md:!hidden" role="navigation" aria-label="Мобильная навигация" data-mobile-menu>
    <div class="container-wide flex flex-col gap-1 py-4">
      {% for item in site.navigation %}
        <a class="rounded-lg px-3 py-2.5 text-sm text-muted transition-colors hover:bg-surface-2 hover:text-foreground {% if page.url == item.url %}bg-surface-2 text-foreground{% endif %}"
           href="{{ item.url | absolute_url }}"
           data-i18n="navigation.{{ item.name | downcase | replace: ' ', '_' }}">
          {{ item.name }}
        </a>
      {% endfor %}
    </div>
  </div>
</header>

<script>
  (function () {
    var toggle = document.querySelector('[data-mobile-toggle]');
    var menu = document.querySelector('[data-mobile-menu]');
    if (!toggle || !menu) return;
    toggle.addEventListener('click', function () {
      var open = menu.classList.toggle('hidden') === false;
      toggle.setAttribute('aria-expanded', String(open));
    });
  })();
</script>

<header class="site-header" role="banner">
  <div class="wrapper">
    <div class="header-content">
      <!-- Logo/Home link -->
      <a class="site-title" href="{{ "/" | absolute_url }}" 
         aria-label="{{ site.title | escape }} - {{ site.description | escape }}">
        <span class="site-logo" data-i18n="site.title">{{ site.title }}</span>
      </a>

      <!-- Desktop Navigation -->
      <nav class="site-nav" role="navigation" aria-label="Основная навигация">
        <div class="nav-desktop">
          {% for item in site.navigation %}
            <a class="page-link {% if page.url == item.url %}active{% endif %}" 
               href="{{ item.url | absolute_url }}"
               data-i18n="navigation.{{ item.name | downcase | replace: ' ', '_' }}">
              {{ item.name }}
            </a>
          {% endfor %}
        </div>
        
        <!-- Theme Toggle -->
        <div class="theme-toggle theme-toggle--header"></div>

        <!-- Semantic Search trigger (Vector B) -->
        <button class="search-trigger" type="button" aria-label="Открыть семантический поиск" data-open-semantic-search>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="M21 21l-4.35-4.35"></path>
          </svg>
          <span class="search-trigger__label" data-i18n="navigation.search">Поиск</span>
          <kbd class="search-trigger__kbd" aria-hidden="true">Alt+K</kbd>
        </button>

        <!-- Mobile Menu Toggle -->
        <button class="menu-icon" 
                type="button" 
                aria-label="Переключить меню навигации"
                aria-expanded="false"
                aria-controls="mobile-menu"
                data-aria-i18n="accessibility.open_menu">
          <span class="hamburger">
            <span></span>
            <span></span>
            <span></span>
          </span>
          <span class="menu-text" data-i18n="navigation.menu">Меню</span>
        </button>
      </nav>
    </div>
    
    <!-- Mobile Navigation -->
    <div id="mobile-menu" class="mobile-menu" role="navigation" aria-label="Мобильная навигация">
      <div class="mobile-menu-content">
        {% for item in site.navigation %}
          <a class="page-link {% if page.url == item.url %}active{% endif %}" 
             href="{{ item.url | absolute_url }}"
             data-i18n="navigation.{{ item.name | downcase | replace: ' ', '_' }}">
            {{ item.name }}
          </a>
        {% endfor %}
        
        <!-- Theme Toggle in Mobile Menu -->
        <div class="theme-toggle theme-toggle--compact mobile-theme-toggle"></div>
      </div>
    </div>
  </div>
</header>

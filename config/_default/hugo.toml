# Hugo + Blowfish configuration — dominicusin.github.io
# Publishing Plane (see docs/SSG_MIGRATION_PLAN.md, variant A).
# Jekyll/src/DAO are preserved untouched; this is an additive parallel scaffold.
#
# All Blowfish [params.*] live in config/_default/params.toml (single source).

baseURL = "https://dominicusin.github.io/"
title = "Dominicus In"
languageCode = "ru"
defaultContentLanguage = "ru"
enableGitInfo = false
paginate = 10
summaryLength = 25

# Preserve raw HTML in Markdown (about.md and posts contain HTML markup).
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Disable Hugo's default taxonomy pluralization surprises; keep standard.
pluralizeListTitles = false
disableKinds = ["RSS"] # RSS enabled explicitly per-language below

# Mark as a user/org GitHub Pages site (no subpath).
canonifyURLs = false

[permalinks]
  blog = "/:year/:month/:day/:slug/"
  people = "/people/:slug/"
  domini = "/domini/:slug/"

[outputs]
  home = ["HTML", "RSS", "JSON", "RedirectIndex"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

# Standard /feed.xml RSS URL (README of the site links to it).
[outputFormats.RSS]
  baseName = "feed"

# Lightweight [{slug,url,title,section}] index powering the 404 smart-redirect
# (broken URL -> fuzzy slug match -> closest existing page). Deliberately small
# (no content) so it loads instantly on a 404; distinct from the 4.4MB search index.
[outputFormats.RedirectIndex]
  baseName = "redirect-index"
  mediaType = "application/json"
  isPlainText = true
  rel = "alternate"

[taxonomies]
  tag = "tags"
  category = "categories"

# Related-content index (powers Blowfish `related.html` on blog single pages).
# Rank by shared tags (primary) then shared categories (secondary).
[related]
  includeNewer = false
  threshold = 0
  toLower = false
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 50

# The GitHub Wiki is mirrored as a git submodule at content/wiki/ (read-only
# source). Its pages are copied + front-matter-injected into content/wiki-build/
# by scripts/generate-wiki-nav.py at build time. Exclude the raw submodule from
# the build so we don't publish duplicate un-menu'd pages. See ADR-0003.
# NOTE: ignoreFiles uses Go regexp (not glob), so `content/wiki/.*\.md$` matches
# only files directly under content/wiki/ — NOT content/wiki-build/.
ignoreFiles = ["content/wiki/.*\\.md$"]

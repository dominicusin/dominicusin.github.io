# Hugo multilingual configuration (variant A — RU primary).
# EN language removed: no content/en exists, so the /en/* mirror only
# produced dead links (e.g. /en/blog). Re-add [languages.en] here if/when
# English content is added under content/en/.

[languages.ru]
  weight = 1
  contentDir = "content"
  label = "Русский"
  [languages.ru.params]
    defaultTheme = "auto"

# Blowfish theme parameters — full feature enablement (variant A publishing plane).
# Consolidated here from the previous [params] block in hugo.toml so all
# theme capabilities are configured in one place. See https://blowfish.page/docs/configuration/

# --- Core appearance ---
colorScheme = "dominicusin"
defaultAppearance = "dark"
description = "Engineering blog & decentralized web notes by Dominicus In."
showDarkModeToggle = true
showLanguageSelector = false       # EN not configured (no content/en); avoid dead /en/* links
mainSections = ["blog"]

# --- Feature flags ---
enableSearch = true          # client-side Fuse.js search (index.json)
enableA11y = true            # improved accessibility (skip-links, a11y nav)
enableCodeCopy = true        # copy-to-clipboard on code blocks
enableStructuredBreadcrumbs = true  # structured-data breadcrumbs (SEO)
highlightCurrentMenuArea = true     # highlight active menu item
smartTOC = true              # scroll-spy table of contents

# --- Images ---
defaultSocialImage = "images/og-default.png"    # OG/Twitter fallback (raster; SVG is not rendered by social platforms)
defaultFeaturedImage = "images/og-default.svg" # card/hero fallback when a post has no image

# --- Subscription (Buttondown) ---
externalSubscriptionURL = "https://buttondown.email/api/emails/embed-subscribe/dominicusin"

# --- Comments (giscus) ---
[giscus]
  repo = "dominicusin/dominicusin.github.io"
  repoId = "MDEwOlJlcG9zaXRvcnk0NjQ1OTg0OQ=="
  category = "Announcements"
  categoryId = "DIC_kwDOAsTryc4CRUZ_"
  mapping = "pathname"
  reactionsEnabled = true
  commentCount = true
  inputPosition = "bottom"
  lang = "ru"
  loading = "lazy"

# --- Header ---
[header]
  layout = "fixed"   # sticky header

# --- Footer ---
[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

# --- Homepage ---
[homepage]
  layout = "custom"           # custom layouts/index.html (glass/neo-modern emerald)
  showRecent = true
  showRecentItems = 8
  showMoreLink = true
  showMoreLinkDest = "blog"

# --- Articles / posts ---
[article]
  showDate = true
  showDateUpdated = false
  showWordCount = true
  showReadingTime = true
  showAuthor = true
  showHeadingAnchors = true   # anchor links on headings
  showZenMode = true          # focus/reading mode toggle
  showTableOfContents = true  # TOC (works with smartTOC scroll-spy)
  showPagination = true
  showRelatedContent = true
  relatedContentLimit = 5
  showTaxonomies = true
  showComments = true
  showBreadcrumbs = true
  showEdit = true             # "Edit this page" GitHub link
  editURL = "https://github.com/dominicusin/dominicusin.github.io/edit/main/content"
  editAppendPath = true
  sharingLinks = ["linkedin", "twitter", "bluesky", "reddit", "telegram", "email"]
  # Views/Likes enabled: firestore.rules shipped (permits authenticated reads
  # + increment-by-1 writes), and assets/js/firebase.js now falls back to "0"
  # instead of a stuck "loading" spinner if the backend is ever unreachable.
  # Deploy the rules once with: firebase deploy --only firestore:rules
  showViews = true
  showLikes = true

# --- List / section pages ---
[list]
  showBreadcrumbs = true
  showDate = true
  showReadingTime = true
  showCards = true
  cardView = true
  # Views enabled (firestore.rules shipped + graceful 0-fallback). See firestore.rules.
  showViews = true

# --- Sitemap ---
[sitemap]
  changeFreq = "monthly"
  priority = 0.5

# --- OpenGraph ---
[opengraph]
  showImages = true
  imagesMaxCount = 3

# --- Twitter / X cards ---
[twitter]
  card = "summary_large_image"
  site = "@dominicusin"

# --- Firebase (post views & likes counters) ---
# Public client-side config (Firebase web apiKey is meant to be embedded;
# access is gated by Firestore Security Rules, not secrecy). Requires an
# active Firebase project with Anonymous Auth enabled and Firestore rules
# permitting reads + increments on views_*/likes_* collections.
[firebase]
  apiKey = "AIzaSyAfGoPVnQZOtTJ3Fbj9u8UYEj8ajIw595w"
  authDomain = "dominicusingithubio.firebaseapp.com"
  projectId = "dominicusingithubio"
  storageBucket = "dominicusinghubio.firebasestorage.app"
  messagingSenderId = "981844297656"
  appId = "1:981844297656:web:a24a4df60a59283ac6314d"
  measurementId = "G-4QCLTEKK18"

[taxonomy]
  # Views enabled (firestore.rules shipped + graceful 0-fallback). See firestore.rules.
  showViews = true

[term]
  # Views enabled (firestore.rules shipped + graceful 0-fallback). See firestore.rules.
  showViews = true

# --- Neo design-system (2026-08-27) ---
# Action URL for the homepage newsletter form in layouts/index.html.
# Defaults to "#" in the template if unset; set to your Buttondown/Mailchimp endpoint.
newsletterAction = ""

name: 🔗 AI Link Repair Agent

on:
  schedule:
    # Запуск каждый понедельник в 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (no PR creation)'
        required: false
        default: 'false'
      min_confidence:
        description: 'Minimum confidence threshold (0.0-1.0)'
        required: false
        default: '0.6'

permissions:
  contents: write
  pull-requests: write
jobs:
  link-repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm ci
          npm install -g @octokit/rest glob
      
      - name: Run Link Repair Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          MIN_CONFIDENCE: ${{ github.event.inputs.min_confidence || '0.6' }}
        run: |
          node src/agents/link-repair-agent.js ${DRY_RUN == 'true' && '--dry-run' || ''}
      
      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: link-scan-results
          path: |
            broken-links-report.json
            suggested-fixes.json
          retention-days: 30
      
      - name: Comment on PR (if created)
        if: success() && github.event.inputs.dry_run != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Читаем результаты сканирования
            let report = { brokenLinks: 0, fixesApplied: 0 };
            try {
              const reportData = fs.readFileSync('broken-links-report.json', 'utf8');
              report = JSON.parse(reportData);
            } catch (e) {
              console.log('Report file not found');
            }
            
            // Находим последний созданный PR
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              sort: 'created',
              direction: 'desc',
              per_page: 1
            });
            
            if (pulls.length > 0 && pulls[0].title.includes('Auto-fix')) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pulls[0].number,
                body: `## 🔗 Link Repair Scan Results
                
                - **Broken links found**: ${report.brokenLinks}
                - **Fixes applied**: ${report.fixesApplied}
                - **Scan time**: ${new Date().toISOString()}
                
                > This comment was automatically generated by the Link Repair Agent.`
              });
            }

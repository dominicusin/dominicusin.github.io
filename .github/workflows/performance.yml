name: 📊 Performance Monitoring

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run daily at 1 AM UTC
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  lighthouse:
    name: 🌐 Lighthouse Performance Audit
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: 🌐 Run Lighthouse CI (against the live Hugo site)
        # Phase 7: the site is now published by Hugo (hugo.yml). We audit the
        # deployed GitHub Pages URL(s) instead of a Jekyll _site build.
        uses: treosh/lighthouse-ci-action@v12
        continue-on-error: true
        with:
          configPath: './.lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: 📈 Core Web Vitals Report
        run: |
          echo "📈 Core Web Vitals Summary (thresholds in .lighthouserc.json):"
          echo "- Performance: Target > 0.7"
          echo "- Accessibility: Target > 0.8"
          echo "- Best Practices: Target > 0.7"
          echo "- SEO: Target > 0.7"

      - name: 📤 Upload Performance Reports
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/

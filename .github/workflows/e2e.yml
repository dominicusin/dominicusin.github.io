name: E2E Tests (Playwright)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: 🎭 Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0
      - name: 🛡️ Ignore nested submodules (avoid recursive fatal)
        run: |
          git config --global submodule."awesome/tools/open-source-ios-apps/ReadmeGenerator".active false
          git config --global submodule."awesome/tools/open-source-mac-os-apps/ReadmeGenerator".active false
          git config --global submodule."awesome/tools/open-source-ios-apps/ReadmeGenerator".update none
          git config --global submodule."awesome/tools/open-source-mac-os-apps/ReadmeGenerator".update none
          git config --global submodule.recurse false

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📥 Init submodules (non-recursive)
        run: |
          git submodule update --init themes/blowfish
          git submodule update --init awesome

      - name: 🔧 Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.164.0'
          extended: false

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: 🎭 Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-pw-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-pw-

      - name: 🎭 Install Playwright browsers (skip re-download if cached)
        run: npx playwright install --with-deps chromium

      - name: 🚀 Run E2E (Hugo dev server + Playwright)
        run: npx playwright test

      - name: 📊 Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

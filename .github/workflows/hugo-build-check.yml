# TEMPORARY build-only check for PR validation (Phase 1, variant A).
# Validates that Hugo builds the migrated content WITHOUT deploying.
# Remove after the production cutover (Phase 5 / PR 5) once hugo.yml's
# push-to-main deploy is the single source of truth.
name: Hugo build check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  HUGO_VERSION: "0.164.0"
  HUGO_ENVIRONMENT: production
  HUGO_ENV: production

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node (content-contract)
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Install deps
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Validate content contract
        run: node scripts/ci-content-contract.cjs

      - name: Build with Hugo (no deploy)
        run: hugo --gc --minify

name: 🔒 Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly on Mondays at 4 AM UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  security-scan:
    name: 🔒 Security Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: 🔍 Node.js Security Audit
        run: |
          npm audit --audit-level=moderate || true
          npm audit --json > npm-audit.json || true

      - name: 🔍 Trivy Vulnerability Scanner
        # Pinned to a release tag (not @master) per supply-chain policy.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: 🚨 Semgrep Security Analysis
        uses: semgrep/semgrep-action@v1
        continue-on-error: true
        with:
          config: >-
            p/security-audit
            p/secrets
            p/cwe-top-25
          generate-sarif: '1'

      - name: 📤 Upload Security Reports
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: |
            npm-audit.json
            trivy-results.sarif
            semgrep.sarif

      - name: 📊 Security Score
        run: |
          echo "🔒 Security Analysis Summary:"
          echo "- Node.js dependencies: ✅ Scanned"
          echo "- File system vulnerabilities: ✅ Scanned (Trivy)"
          echo "- Code security patterns: ✅ Scanned (Semgrep)"
          echo "- Secrets detection: ✅ Scanned"

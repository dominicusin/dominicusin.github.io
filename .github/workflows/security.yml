name: Security Scanning

on:
  push:
    branches: [main]
    paths:
      - "*.js"
      - "*.cjs"
      - "*.mjs"
      - "**/*.js"
      - "**/*.cjs"
      - "**/*.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
      - ".github/codeql/**"
      - "agent/**"
      - "src/**"
  pull_request:
    branches: [main]
    paths:
      - "*.js"
      - "*.cjs"
      - "*.mjs"
      - "**/*.js"
      - "**/*.cjs"
      - "**/*.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
      - ".github/codeql/**"
      - "agent/**"
      - "src/**"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Audit locked dependencies
        run: |
          npm audit --json > npm-audit.json || true
          node -e '
            const report = require("./npm-audit.json");
            const counts = report.metadata?.vulnerabilities || {};
            console.log("npm audit:", JSON.stringify(counts));
            if ((counts.critical || 0) > 0) {
              console.error("Critical dependency vulnerabilities found.");
              process.exit(1);
            }
          '

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          retention-days: 30

  filesystem-scan:
    name: Trivy and Semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif

      - name: Semgrep security analysis
        uses: semgrep/semgrep-action@v1
        continue-on-error: true
        with:
          config: >-
            p/security-audit
            p/secrets
            p/cwe-top-25
          generate-sarif: "1"

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            trivy-results.sarif
            semgrep.sarif
          retention-days: 30

  secret-scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: SBOM Generation

# Generate a Software Bill of Materials for every push to main and on
# dispatch. The SBOM is uploaded as a workflow artifact and (when
# enabled) to the dependency snapshot API for supply-chain visibility.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@v0.17.0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 30

      - name: Generate Generic Attestations
        uses: actions/attest@v4.2.2
        with:
          subject-path: sbom.spdx.json
          predicate-type: https://spdx.dev/Document
          predicate-path: sbom.spdx.json

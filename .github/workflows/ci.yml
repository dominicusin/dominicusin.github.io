name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint || true
      
      - name: Run tests
        run: npm run test
      
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage/lcov.info
          fail_ci_if_error: false

  build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build assets
        run: npm run build
      
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true
      
      - name: Build Jekyll
        run: bundle exec jekyll build
      
      - name: Upload artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site/'

  # NOTE: Jekyll deploy to GitHub Pages is intentionally DISABLED (Phase 5 of
  # docs/SSG_MIGRATION_PLAN.md, variant A). Hugo (hugo.yml) is now the single
  # Pages publisher. This workflow still builds Jekyll for CI validation only.
  # To re-enable Jekyll publishing, restore the `deploy` job below:
  #   deploy:
  #     needs: build
  #     if: github.ref == 'refs/heads/main'
  #     runs-on: ubuntu-latest
  #     permissions: { pages: write, id-token: write }
  #     environment: { name: github-pages, url: ${{ steps.deployment.outputs.page_url }} }
  #     steps:
  #       - name: Deploy to GitHub Pages
  #         id: deployment
  #         uses: actions/deploy-pages@v4

name: Awesome Lists (refresh + discover)

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      max_new:
        description: "Maximum number of lists to add"
        required: false
        default: "3"
      min_stars:
        description: "Minimum GitHub stars for a candidate"
        required: false
        default: "800"

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: awesome-maintenance
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0

      - name: Disable nested submodules
        run: |
          git config --global submodule."awesome/tools/open-source-ios-apps/ReadmeGenerator".active false
          git config --global submodule."awesome/tools/open-source-mac-os-apps/ReadmeGenerator".active false
          git config --global submodule."awesome/tools/open-source-ios-apps/ReadmeGenerator".update none
          git config --global submodule."awesome/tools/open-source-mac-os-apps/ReadmeGenerator".update none
          git config --global submodule.recurse false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Initialize curated lists
        run: git submodule update --init --jobs 4 themes/blowfish awesome

      - name: Refresh and discover lists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWESOME_MAX_NEW: ${{ github.event.inputs.max_new || '3' }}
          AWESOME_MIN_STARS: ${{ github.event.inputs.min_stars || '800' }}
        run: |
          node scripts/refresh-awesome.cjs
          node scripts/discover-awesome.cjs
          node scripts/build-awesome.cjs

      - name: Setup Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.164.0"
          extended: true

      - name: Validate the updated catalog
        run: |
          hugo --gc --minify --baseURL "https://example.com/"
          rm -rf public resources

      - name: Create or update the maintenance pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add .gitmodules awesome data/awesome.json
          if git diff --cached --quiet; then
            echo "No curated-list changes to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="bot/awesome-maintenance"
          git checkout -B "$branch"
          git commit -m "bot: refresh curated awesome lists"
          git push --force-with-lease origin "$branch"

          pr_number="$(gh pr list --head "$branch" --base main --json number --jq '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "bot: refresh curated awesome lists" \
              --body "Weekly refresh of existing Awesome lists and discovery of new curated lists. The catalog is built with Hugo before this PR is opened." \
              --label "awesome"
          else
            gh pr edit "$pr_number" \
              --title "bot: refresh curated awesome lists" \
              --body "Weekly refresh of existing Awesome lists and discovery of new curated lists. The catalog is built with Hugo before this PR is updated."
          fi

          gh workflow run quality.yml --ref "$branch"

name: 🧪 R&D Tests

# STATUS: disabled manually in GitHub Actions after the DAO test job failed on
# main (last updated 2026-08-25). Do not describe this workflow as an active
# check. Re-enable it after repairing and verifying the DAO test suite.
#
# When enabled, this isolates the experimental-plane suites (src/ Jest and
# contracts/dao Hardhat) from the production Hugo build, so an R&D failure does
# not block the Pages deploy. The job is not a required status check for merge.

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'contracts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'jest.config.js'
      - 'babel.config.cjs'
      - '.babelrc'
      - 'hardhat.config.cjs'
      - 'tailwind.config.js'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'contracts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'jest.config.js'
      - 'babel.config.cjs'
      - '.babelrc'
      - 'hardhat.config.cjs'
      - 'tailwind.config.js'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  rnd-unit:
    name: 🧪 R&D Unit tests (jest — same suites as prod; src/ suites are quarantined)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: 📦 Install deps
        run: npm ci --no-audit --no-fund
      - name: 🧹 Lint (eslint)
        run: npm run lint
      - name: 🧪 Jest (R&D surface smoke test)
        # NOTE: jest.config.js roots = ['<rootDir>/tests'] and there are 0 tests
        # under src/ (R&D suites are quarantined — they fail against the real
        # implementation). This job therefore runs the SAME 29 suites as the
        # production Quality CI as a smoke check that R&D-surface file changes
        # don't break the shared test harness. It is NOT an isolated src/ gate.
        # To make it a true R&D gate, add `npx jest --config jest.config.js
        # --testPathPattern='<quarantine patterns>'` (expects those suites green).
        run: npx jest --config jest.config.js --coverage=false

  rnd-dao:
    name: ⛓️ DAO contract tests (Hardhat)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: 📦 Install deps
        run: npm ci --no-audit --no-fund
      - name: ⛓️ Hardhat tests
        run: npx hardhat test

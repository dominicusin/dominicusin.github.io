name: 🔍 Quality CI

# Consolidated quality gate (separate from the Pages deploy in hugo.yml).
# Runs on PRs so author can see failures before merge. Does NOT deploy.
# Mirrors the four-stage plan: build → validate → test → link/HTML check.

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  HUGO_VERSION: "0.164.0"

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 🧪 Build, validate, test, link-check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0
      - name: 🛡️ Ignore nested submodules (avoid recursive fatal)
        run: |
          git config --global submodule."awesome/tools/open-source-ios-apps/ReadmeGenerator".active false
          git config --global submodule."awesome/tools/open-source-mac-os-apps/ReadmeGenerator".active false

      - name: 🔎 actionlint (workflow YAML structural check)
        run: |
          curl -sL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash
          ./actionlint -shellcheck= -pyflakes= .github/workflows/*.yml

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: 🔧 Setup Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: 🗄️ Cache Hugo build (modules + build cache)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/hugo_cache
            ~/.cache/hugo_modules
          key: ${{ runner.os }}-hugo-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-hugo-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-hugo-

      - name: 📥 Init submodules (non-recursive)
        # Checkout uses submodules:false to avoid recursing into nested
        # submodules (e.g. awesome/tools/open-source-ios-apps contains a
        # ReadmeGenerator submodule absent from our .gitmodules -> fatal).
        # We init only the direct submodules the build needs, non-recursively.
        run: |
          git submodule update --init themes/blowfish
          git submodule update --init awesome

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: 🏗️ Build Hugo (catch template/layout errors)
        run: hugo --gc --minify

      - name: 🛡️ Catalog guard (fail if awesome catalog is empty/regressed)
        run: |
          node -e "const d=require('./data/awesome.json'); const n=d.total||0; if(n<10){console.error('Catalog too small: '+n+' lists (expected >=10)'); process.exit(1);} console.log('Catalog OK: '+n+' lists in '+(d.groups||[]).length+' groups');"

      - name: ⚡ Performance smoke check (render-blocking regression guard)
        # scripts/check-perf.cjs fails only on a real render-blocking <script>
        # regression (it would have caught the #111 JS bug). CSS bundle size is
        # reported as informational (render-blocking CSS is intentional — avoids
        # the CLS=1.0 unstyled-flash bug). Complements the Lighthouse job.
        run: node scripts/check-perf.cjs

      - name: 📝 Content Contract (hard gate on PR — blocks invalid new posts; merge-base diff keeps main green)
        run: node scripts/ci-content-contract.cjs

      - name: 🧹 Lint (eslint)
        run: npm run lint

      # NOTE: R&D unit (jest) + DAO (hardhat) tests are run in the dedicated
      # test-rnd.yml workflow so a flaky R&D test cannot block the Pages deploy.
      # They are still enforced on R&D-relevant changes (src/, contracts/, tests/).

      - name: 🔗 Broken internal link check (built surface)
        run: node scripts/check-links.cjs

      - name: 🔗 Internal link audit (source markdown, pre-build)
        # Source-level audit of content/**/*.md — complements the built-surface
        # check above (catches dead links before Hugo resolves aliases/redirects).
        # Report-only: always exits 0. Was previously dead code (never wired in).
        run: node scripts/audit-internal-links.cjs

      - name: 🩺 HTML well-formedness (report, non-blocking)
        run: node scripts/check-html.cjs
        continue-on-error: true

      - name: 🌐 External link audit (report, non-blocking)
        # Skips social share-intent hosts; checks content links with bounded
        # timeout. Dead links are reported as warnings, never fail the build.
        run: node scripts/check-external-links.cjs
        continue-on-error: true

      - name: 🩺 Accessibility audit (report, non-blocking)
        # Real axe-core audit of the BUILT site (public/). Catches a11y
        # regressions that mock-based unit suites miss.
        run: node scripts/check-a11y.cjs
        continue-on-error: true

      - name: 🖼️ OG-image guard (report, non-blocking)
        # Ensures dated posts render a valid og:image (falls back to
        # og-default.png). Regressions surface as warnings.
        run: node scripts/check-og-image.cjs
        continue-on-error: true

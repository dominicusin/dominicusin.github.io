name: 🔍 Quality CI

# Consolidated quality gate (separate from the Pages deploy in hugo.yml).
# Runs on PRs so author can see failures before merge. Does NOT deploy.
# Mirrors the four-stage plan: build → validate → test → link/HTML check.

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  HUGO_VERSION: "0.164.0"

jobs:
  quality:
    name: 🧪 Build, validate, test, link-check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: 🔧 Setup Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: 🏗️ Build Hugo (catch template/layout errors)
        run: hugo --gc --minify

      - name: 📝 Content Contract (report-only on PR; hard gate is in hugo.yml)
        run: node scripts/ci-content-contract.cjs || true

      - name: 🧹 Lint (eslint)
        run: npm run lint

      - name: 🧪 Unit tests (jest)
        # The repo's jest.config.js already quarantines broken suites (a11y/,
        # vector-search-service, etc. — see the "Quarantine" note in jest.config.js).
        # We must pass the FULL ignore list here because the CLI flag REPLACES
        # (not appends to) the config's testPathIgnorePatterns. theme-manager is
        # an additional known-flaky test (module-level link-state leak) quarantined
        # from this gate; it still runs in the full local `npm test` suite.
        run: npx jest --config jest.config.js --coverage=false \
          --testPathIgnorePatterns \
          "tests/a11y/" \
          "tests/integration/module-loading.test.js" \
          "tests/unit/image-optimizer.test.js" \
          "tests/unit/pwa-service.test.js" \
          "tests/unit/rum-service.test.js" \
          "tests/unit/search-engine.test.js" \
          "tests/unit/vector-search-service.test.js" \
          "tests/unit/theme-manager.test.js"

      - name: ⛓️ DAO contract tests (Hardhat)
        run: npx hardhat test

      - name: 🔗 Broken internal link check
        run: node scripts/check-links.cjs

      - name: 🩺 HTML well-formedness (report, non-blocking)
        run: node scripts/check-html.cjs
        continue-on-error: true

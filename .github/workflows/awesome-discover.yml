name: Discover new Awesome lists

# Finds curated Awesome lists on GitHub and adds them as sparse submodules
# under content/awesome/<group>/<repo> (README-only). Runs on a weekly
# schedule and can be triggered manually. If new lists are discovered it
# opens a pull request; the PR is merged by a maintainer (or auto-merged
# when checks pass).

on:
  schedule:
    - cron: "17 6 * * 1"   # every Monday 06:17 UTC
  workflow_dispatch:
    inputs:
      max_new:
        description: "Max new lists to add this run"
        required: false
        default: "3"
      min_stars:
        description: "Minimum GitHub stars for a candidate"
        required: false
        default: "800"

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
      - name: 🛡️ Ignore nested submodules (avoid recursive fatal)
        run: |
          git config --global submodule."awesome/tools/open-source-ios-apps/ReadmeGenerator".active false
          git config --global submodule."awesome/tools/open-source-mac-os-apps/ReadmeGenerator".active false
          git config --global submodule."awesome/tools/open-source-ios-apps/ReadmeGenerator".update none
          git config --global submodule."awesome/tools/open-source-mac-os-apps/ReadmeGenerator".update none
          git config --global submodule.recurse false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: 📥 Init submodules (non-recursive)
        # Checkout uses submodules:false so it won't recurse into nested
        # submodules (e.g. open-source-ios-apps/ReadmeGenerator) absent from our
        # root .gitmodules. We init only the direct submodules the job needs.
        run: |
          git submodule update --init themes/blowfish
          git submodule update --init awesome

      - name: Discover and add new awesome lists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWESOME_MAX_NEW: ${{ github.event.inputs.max_new || '3' }}
          AWESOME_MIN_STARS: ${{ github.event.inputs.min_stars || '800' }}
        run: node scripts/discover-awesome.cjs

      - name: Rebuild catalog data
        run: node scripts/build-awesome.cjs
      - name: Setup Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.164.0"
          extended: true

      - name: Build site (guard — new lists must not break the build)
        # Renders the /awesome/ catalog + preview pages. If a freshly added
        # list (or its README) breaks the build, the workflow fails HERE
        # (before opening a PR) instead of merging broken content later.
        run: |
          hugo --gc --minify --baseURL "https://example.com/"
          rm -rf public resources


      - name: Open PR if anything changed
        id: pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Stage submodule registration + any new gitlinks
          git add .gitmodules awesome
          if git diff --cached --quiet; then
            echo "nothing to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="bot/awesome-discover-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m "bot: discover new curated awesome lists"
          git push --force-with-lease origin "$BRANCH"
          gh pr create \
            --title "bot: discover new curated awesome lists" \
            --body "Automated discovery added new awesome lists as sparse submodules under content/awesome/. Review and merge." \
            --label "awesome" --auto || true
          echo "changed=true" >> "$GITHUB_OUTPUT"

name: Links (check + repair)

# Consolidated from markdown-link-check.yml + link-repair.yml.

on:
  pull_request:
    paths: ['**.md', 'content/**']
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    name: Check markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Link check (markdown)
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.github/markdown-link-check.json'
        continue-on-error: true

  link-repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm ci
      
      - name: Run Link Repair Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          MIN_CONFIDENCE: ${{ github.event.inputs.min_confidence || '0.6' }}
        run: |
          node src/agents/link-repair-agent.js ${DRY_RUN == 'true' && '--dry-run' || ''}
      
      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: link-scan-results
          path: |
            broken-links-report.json
            suggested-fixes.json
          retention-days: 30
      
      - name: Comment on PR (if created)
        if: success() && github.event.inputs.dry_run != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Читаем результаты сканирования
            let report = { brokenLinks: 0, fixesApplied: 0 };
            try {
              const reportData = fs.readFileSync('broken-links-report.json', 'utf8');
              report = JSON.parse(reportData);
            } catch (e) {
              console.log('Report file not found');
            }
            
            // Находим последний созданный PR
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              sort: 'created',
              direction: 'desc',
              per_page: 1
            });
            
            if (pulls.length > 0 && pulls[0].title.includes('Auto-fix')) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pulls[0].number,
                body: `## 🔗 Link Repair Scan Results
                
                - **Broken links found**: ${report.brokenLinks}
                - **Fixes applied**: ${report.fixesApplied}
                - **Scan time**: ${new Date().toISOString()}
                
                > This comment was automatically generated by the Link Repair Agent.`
              });
            }

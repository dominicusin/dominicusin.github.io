name: 🥽 VR/AR Export Automation

on:
  push:
    paths:
      - 'assets/data/knowledge-graph.json'
      - 'src/services/vr-export-service.js'
  workflow_dispatch:
    inputs:
      quality:
        description: 'Export quality (low/medium/high)'
        required: false
        default: 'medium'
      format:
        description: 'Output format (glb/gltf/both)'
        required: false
        default: 'glb'

jobs:
  generate-vr-scene:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
      statuses: write
      actions: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate VR Scene
        env:
          EXPORT_QUALITY: ${{ github.event.inputs.quality || 'medium' }}
          EXPORT_FORMAT: ${{ github.event.inputs.format || 'glb' }}
        run: |
          node scripts/generate-vr-scene.js
      
      - name: Upload GLB artifact
        if: github.event.inputs.format != 'gltf'
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-graph-glb
          path: assets/vr/knowledge-graph.glb
          retention-days: 30
      
      - name: Upload GLTF artifact
        if: github.event.inputs.format != 'glb'
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-graph-gltf
          path: assets/vr/knowledge-graph.gltf
          retention-days: 30
      
      - name: Deploy to GitHub Pages (VR)
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./assets/vr
          destination_dir: vr
      
      - name: Create release with VR files
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            assets/vr/knowledge-graph.glb
            assets/vr/knowledge-graph.gltf
          body: |
            ## VR/AR Export
            
            Автоматически сгенерированная 3D сцена Графа Знаний.
            
            ### Как использовать:
            1. Скачайте `.glb` файл для просмотра в VR-шлеме
            2. Откройте через Meta Quest Browser, SteamVR или Sketchfab
            3. Для веб-просмотра используйте WebXR-compatible браузер
            
            ### Статистика:
            - Узлов: ${{ env.NODE_COUNT }}
            - Связей: ${{ env.EDGE_COUNT }}
            - Размер: ${{ env.FILE_SIZE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Notify on completion
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const quality = '${{ github.event.inputs.quality || "medium" }}';
            const format = '${{ github.event.inputs.format || "glb" }}';
            
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `## 🥽 VR Export Complete
                
                - **Quality**: ${quality}
                - **Format**: ${format}
                - **Artifacts**: Available in Actions tab
                
                View in VR headset or download for offline viewing.`
            });

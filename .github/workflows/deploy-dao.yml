name: Deploy DAO to Sepolia

on:
  workflow_dispatch:
    inputs:
      network:
        description: 'Target network (sepolia | goerli)'
        required: false
        default: 'sepolia'
  push:
    branches: [main]
    paths: ['contracts/**', 'hardhat.config.cjs', 'scripts/deploy-dao.cjs', 'package*.json']
  pull_request:
    branches: [main]
    paths: ['contracts/**', 'hardhat.config.cjs', 'scripts/deploy-dao.cjs', 'package*.json']

jobs:
  test:
    name: DAO contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Compile
        run: npx hardhat compile

      - name: Test (hardhat)
        run: npx hardhat test

  deploy:
    name: Deploy DAO contracts
    runs-on: ubuntu-latest
    # Tests must pass before we even consider deploying.
    needs: test
    # Only deploy from main via workflow_dispatch or a direct push with secrets;
    # never from a PR (PRs only run the test job above).
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    # Hard requirement: a funded wallet private key must be supplied as a
    # repository secret. Without it we fail loudly rather than fake a deploy.
    env:
      DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
      SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Guard — require deploy secrets
        run: |
          if [ -z "$DEPLOY_PRIVATE_KEY" ] || [ -z "$SEPOLIA_RPC_URL" ]; then
            echo "::error::DEPLOY_PRIVATE_KEY and SEPOLIA_RPC_URL secrets are required to deploy."
            echo "Add them under Settings > Secrets before running this workflow."
            exit 1
          fi

      - name: Compile
        run: npx hardhat compile

      - name: Deploy to target network
        env:
          # workflow_dispatch input is operator-controlled, not attacker PR/issue
          # content; still constrain to an allowlist for safety.
          NETWORK: ${{ github.event.inputs.network }}
        run: |
          NET="${NETWORK:-sepolia}"
          case "$NET" in
            sepolia|goerli) ;;
            *) echo "::error::unsupported network '$NET'"; exit 1 ;;
          esac
          npx hardhat run scripts/deploy-dao.cjs --network "$NET"

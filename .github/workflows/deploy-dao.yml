name: Deploy DAO to Sepolia

on:
  workflow_dispatch:
    inputs:
      network:
        description: 'Target network (sepolia | goerli)'
        required: false
        default: 'sepolia'
  push:
    branches: [main]
    paths: ['contracts/**', 'hardhat.config.cjs', 'scripts/deploy-dao.cjs', 'package*.json']
  pull_request:
    branches: [main]
    paths: ['contracts/**', 'hardhat.config.cjs', 'scripts/deploy-dao.cjs', 'package*.json']

permissions:
  contents: read
jobs:
  test:
    name: DAO contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Compile
        run: npx hardhat compile

      - name: Test (hardhat)
        run: npx hardhat test

      - name: DAO security static audit
        # scripts/audit-dao.cjs checks the compiled contracts for safety patterns
        # (AccessControl gating, non-transferable Soulbound, restricted mint). It is
        # a static analysis gate (no secrets) — documented in BASELINE_METRICS.md.
        run: node scripts/audit-dao.cjs

  deploy:
    name: Deploy DAO contracts
    runs-on: ubuntu-latest
    # Deploy only from main/dispatch; never from a PR. Secret presence is
    # checked INSIDE the job (secrets are not addressable in `if:` contexts).
    # Without credentials the deploy step skips (exit 0) so the check stays
    # non-blocking. Tests (above) always run.
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    # Tests must pass before we even consider deploying.
    needs: test
    # Hard requirement: a funded wallet private key must be supplied as a
    # repository secret. Without it we skip (exit 0), not fake a deploy.
    env:
      DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
      SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Guard — require deploy secrets (skip if absent)
        run: |
          if [ -z "$DEPLOY_PRIVATE_KEY" ] || [ -z "$SEPOLIA_RPC_URL" ]; then
            echo "No DEPLOY_PRIVATE_KEY / SEPOLIA_RPC_URL secrets — skipping deploy (non-blocking)."
            exit 0
          fi
          echo "Deploy credentials present — proceeding."

      - name: Compile
        if: ${{ env.DEPLOY_PRIVATE_KEY != '' }}
        run: npx hardhat compile

      - name: Deploy to target network
        if: ${{ env.DEPLOY_PRIVATE_KEY != '' }}
        env:
          # workflow_dispatch input is operator-controlled, not attacker PR/issue
          # content; still constrain to an allowlist for safety.
          NETWORK: ${{ github.event.inputs.network }}
        run: |
          NET="${NETWORK:-sepolia}"
          case "$NET" in
            sepolia|goerli) ;;
            *) echo "::error::unsupported network '$NET'"; exit 1 ;;
          esac
          npx hardhat run scripts/deploy-dao.cjs --network "$NET"

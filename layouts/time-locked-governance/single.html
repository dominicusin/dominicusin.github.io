{{/* Time-Locked Governance */}}
<!DOCTYPE html><html lang="ru" data-theme="dark">{{ partial "neo-head.html" . }}<body>
{{ partial "neo-header.html" . }}<main class="neo" id="main"><div class="neo-wrap">
<div class="neo-sec-head" style="margin-top:20px"><h2>⏳ Time-Locked</h2>
<span class="more">Управление через время</span></div>
<section class="neo-tl">
<div class="neo-tl-grid">
<div class="neo-tl-card"><h3>Future Governance</h3><span class="neo-tl-status beta">Beta</span><p>Time capsules</p></div>
<div class="neo-tl-card"><h3>Temporal Voting</h3><span class="neo-tl-status active">Active</span><p>Long-term</p></div>
<div class="neo-tl-card"><h3>Intergenerational</h3><span class="neo-tl-status active">Active</span><p>Future generations</p></div>
</div></section></div></main>{{ partial "neo-footer.html" . }}
<style>.neo-tl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin:2rem 0}.neo-tl-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1.5rem;text-align:center}.neo-tl-card h3{margin-bottom:.5rem}.neo-tl-status{display:inline-block;padding:.2rem .6rem;border-radius:999px;font-size:.75rem;margin-bottom:.5rem}.neo-tl-status.active{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}.neo-tl-status.beta{background:color-mix(in srgb,var(--violet) 20%,transparent);color:var(--violet)}.neo-tl-card p{color:var(--muted);font-size:.85rem}</style>
</body></html>

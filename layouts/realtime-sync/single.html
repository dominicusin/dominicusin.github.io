{{/* Real-Time Global Sync */}}
<!DOCTYPE html><html lang="ru" data-theme="dark">{{ partial "neo-head.html" . }}<body>
{{ partial "neo-header.html" . }}<main class="neo" id="main"><div class="neo-wrap">
<div class="neo-sec-head" style="margin-top:20px"><h2>🔄 Real-Time Sync</h2>
<span class="more">Глобальная синхронизация</span></div>
<section class="neo-rts">
<div class="neo-rts-grid">
<div class="neo-rts-card"><h3>CRDT Sync</h3><span class="neo-rts-status active">Active</span><p>Conflict-free</p></div>
<div class="neo-rts-card"><h3>Sync Latency</h3><span class="neo-rts-value">&lt;50ms</span><p>Global</p></div>
<div class="neo-rts-card"><h3>Concurrent Users</h3><span class="neo-rts-value">1M+</span><p>Supported</p></div>
</div></section></div></main>{{ partial "neo-footer.html" . }}
<style>.neo-rts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin:2rem 0}.neo-rts-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1.5rem;text-align:center}.neo-rts-card h3{margin-bottom:.5rem}.neo-rts-status{display:inline-block;padding:.2rem .6rem;border-radius:999px;font-size:.75rem;background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent);margin-bottom:.5rem}.neo-rts-value{font-size:1.5rem;font-weight:700}.neo-rts-card p{color:var(--muted);font-size:.85rem}</style>
</body></html>

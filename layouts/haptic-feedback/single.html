{{/* Haptic Feedback */}}
<!DOCTYPE html><html lang="ru" data-theme="dark">{{ partial "neo-head.html" . }}<body>
{{ partial "neo-header.html" . }}<main class="neo" id="main"><div class="neo-wrap">
<div class="neo-sec-head" style="margin-top:20px"><h3>🤚 Haptic Feedback</h3>
<span class="more">Тактильная обратная связь</span></div>
<section class="neo-hf">
<div class="neo-hf-grid">
<div class="neo-hf-card"><h3>Gesture Recognition</h3><span class="neo-hf-status active">Active</span><p>10 gestures</p></div>
<div class="neo-hf-card"><h3>Force Feedback</h3><span class="neo-hf-status beta">Beta</span><p>Supported</p></div>
<div class="neo-hf-card"><h3>Texture Simulation</h3><span class="neo-hf-status planned">Planned</span><p>Coming soon</p></div>
</div></section></div></main>{{ partial "neo-footer.html" . }}
<style>.neo-hf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin:2rem 0}.neo-hf-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1.5rem;text-align:center}.neo-hf-card h3{margin-bottom:.5rem}.neo-hf-status{display:inline-block;padding:.2rem .6rem;border-radius:999px;font-size:.75rem;margin-bottom:.5rem}.neo-hf-status.active{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}.neo-hf-status.beta{background:color-mix(in srgb,var(--violet) 20%,transparent);color:var(--violet)}.neo-hf-status.planned{background:var(--line);color:var(--muted)}.neo-hf-card p{color:var(--muted);font-size:.85rem}</style>
</body></html>

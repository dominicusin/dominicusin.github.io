{{/* Mars Colony DAO */}}
<!DOCTYPE html><html lang="ru" data-theme="dark">{{ partial "neo-head.html" . }}<body>
{{ partial "neo-header.html" . }}<main class="neo" id="main"><div class="neo-wrap">
<div class="neo-sec-head" style="margin-top:20px"><h2>🔴 Mars Colony</h2>
<span class="more">DAO марсианской колонии</span></div>
<section class="neo-mc">
<div class="neo-mc-grid">
<div class="neo-mc-card"><h3>Mars Governance</h3><span class="neo-mc-status active">Active</span><p>Colony management</p></div>
<div class="neo-mc-card"><h3>Mars Economy</h3><span class="neo-mc-status active">Active</span><p>KNOW on Mars</p></div>
<div class="neo-mc-card"><h3>Earth-Mars Link</h3><span class="neo-mc-status active">Active</span><p>Communication</p></div>
</div></section></div></main>{{ partial "neo-footer.html" . }}
<style>.neo-mc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin:2rem 0}.neo-mc-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1.5rem;text-align:center}.neo-mc-card h3{margin-bottom:.5rem}.neo-mc-status{display:inline-block;padding:.2rem .6rem;border-radius:999px;font-size:.75rem;background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent);margin-bottom:.5rem}.neo-mc-card p{color:var(--muted);font-size:.85rem}</style>
</body></html>

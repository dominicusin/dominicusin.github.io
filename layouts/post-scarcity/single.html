{{/* Post-Scarcity Economics */}}
<!DOCTYPE html><html lang="ru" data-theme="dark">{{ partial "neo-head.html" . }}<body>
{{ partial "neo-header.html" . }}<main class="neo" id="main"><div class="neo-wrap">
<div class="neo-sec-head" style="margin-top:20px"><h2>♾️ Post-Scarcity</h2>
<span class="more">Экономика изобилия</span></div>
<section class="neo-ps">
<div class="neo-ps-grid">
<div class="neo-ps-card"><h3>UBI</h3><span class="neo-ps-status active">Active</span><p>Basic income</p></div>
<div class="neo-ps-card"><h3>Resource Economy</h3><span class="neo-ps-status beta">Beta</span><p>Abundance</p></div>
<div class="neo-ps-card"><h3>Energy Credits</h3><span class="neo-ps-status planned">Planned</span><p>Clean energy</p></div>
</div></section></div></main>{{ partial "neo-footer.html" . }}
<style>.neo-ps-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin:2rem 0}.neo-ps-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1.5rem;text-align:center}.neo-ps-card h3{margin-bottom:.5rem}.neo-ps-status{display:inline-block;padding:.2rem .6rem;border-radius:999px;font-size:.75rem;margin-bottom:.5rem}.neo-ps-status.active{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}.neo-ps-status.beta{background:color-mix(in srgb,var(--violet) 20%,transparent);color:var(--violet)}.neo-ps-status.planned{background:var(--line);color:var(--muted)}.neo-ps-card p{color:var(--muted);font-size:.85rem}</style>
</body></html>

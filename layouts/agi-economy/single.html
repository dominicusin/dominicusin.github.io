{{/* AGI Economy */}}
<!DOCTYPE html><html lang="ru" data-theme="dark">{{ partial "neo-head.html" . }}<body>
{{ partial "neo-header.html" . }}<main class="neo" id="main"><div class="neo-wrap">
<div class="neo-sec-head" style="margin-top:20px"><h2>💰 AGI Economy</h2>
<span class="more">AGI-экономика</span></div>
<section class="neo-agi-eco">
<div class="neo-agi-eco-grid">
<div class="neo-agi-eco-card"><h3>AGI Labor</h3><span class="neo-agi-eco-status active">Active</span><p>Autonomous</p></div>
<div class="neo-agi-eco-card"><h3>Marketplace</h3><span class="neo-agi-eco-status active">Active</span><p>Services</p></div>
<div class="neo-agi-eco-card"><h3>Insurance</h3><span class="neo-agi-eco-status beta">Beta</span><p>Coverage</p></div>
</div></section></div></main>{{ partial "neo-footer.html" . }}
<style>.neo-agi-eco-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin:2rem 0}.neo-agi-eco-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1.5rem;text-align:center}.neo-agi-eco-card h3{margin-bottom:.5rem}.neo-agi-eco-status{display:inline-block;padding:.2rem .6rem;border-radius:999px;font-size:.75rem;margin-bottom:.5rem}.neo-agi-eco-status.active{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}.neo-agi-eco-status.beta{background:color-mix(in srgb,var(--violet) 20%,transparent);color:var(--violet)}.neo-agi-eco-card p{color:var(--muted);font-size:.85rem}</style>
</body></html>

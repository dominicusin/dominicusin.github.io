{{/* AI Agents — autonomous agent dashboard. */}}
<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode | default "ru" }}" data-theme="dark">
{{ partial "neo-head.html" . }}
<body>
{{ partial "neo-header.html" . }}
<main class="neo" id="main">
<div class="neo-wrap">
  <div class="neo-sec-head" style="margin-top:20px"><h2>🤖 AI Agents</h2>
    <span class="more">Autonomous agents managing the platform</span>
  </div>
  {{ .Content }}

  <div id="neo-ai-agents">
    <div class="neo-ai-loading">Loading agents...</div>
  </div>
</div>
</main>
{{ partial "neo-footer.html" . }}

<script type="module">
import { h, render, useState, useEffect, useCallback } from 'https://esm.sh/preact@10.24.0';
import htm from 'https://esm.sh/htm@3.1.1';

const html = htm.bind(h);

function AgentsDashboard() {
  const [agents, setAgents] = useState([
    { id: 'content-curator', name: 'Content Curator', func: 'Find relevant content', trigger: 'Daily 9:00', status: 'active', lastRun: '2h ago', runs: 45 },
    { id: 'community-manager', name: 'Community Manager', func: 'Respond to comments', trigger: 'Real-time', status: 'active', lastRun: '5m ago', runs: 312 },
    { id: 'seo-optimizer', name: 'SEO Optimizer', func: 'Optimize meta tags', trigger: 'On publish', status: 'active', lastRun: '1h ago', runs: 89 },
    { id: 'translation-bot', name: 'Translation Bot', func: 'Translate to 5 langs', trigger: 'On publish', status: 'beta', lastRun: '3h ago', runs: 23 },
    { id: 'analytics-reporter', name: 'Analytics Reporter', func: 'Weekly reports', trigger: 'Monday 10:00', status: 'active', lastRun: '2d ago', runs: 12 }
  ]);
  const [selected, setSelected] = useState(null);
  const [logs, setLogs] = useState([]);
  const [showSettings, setShowSettings] = useState(false);
  const [showCreate, setShowCreate] = useState(false);
  const [newAgent, setNewAgent] = useState({ name: '', func: '', trigger: 'daily' });

  const addLog = useCallback((msg) => {
    setLogs(prev => [{ time: new Date().toLocaleTimeString(), msg }, ...prev].slice(0, 50));
  }, []);

  const triggerAgent = useCallback((id) => {
    const agent = agents.find(a => a.id === id);
    if (!agent) return;
    addLog(`Triggering ${agent.name}...`);
    // In production, this would call GitHub Actions API
    setTimeout(() => {
      addLog(`${agent.name} completed`);
    }, 3000);
  }, [agents, addLog]);

  const toggleAgent = useCallback((id) => {
    setAgents(prev => prev.map(a => a.id === id ? { ...a, status: a.status === 'active' ? 'paused' : 'active' } : a));
  }, []);

  const createAgent = useCallback(() => {
    if (!newAgent.name) return;
    const agent = {
      id: newAgent.name.toLowerCase().replace(/\s+/g, '-'),
      name: newAgent.name,
      func: newAgent.func,
      trigger: newAgent.trigger,
      status: 'draft',
      lastRun: 'Never',
      runs: 0
    };
    setAgents(prev => [...prev, agent]);
    setNewAgent({ name: '', func: '', trigger: 'daily' });
    setShowCreate(false);
    addLog(`Created agent: ${agent.name}`);
  }, [newAgent, addLog]);

  useEffect(() => {
    // Simulate agent activity
    const interval = setInterval(() => {
      if (Math.random() > 0.8) {
        addLog('System heartbeat OK');
      }
    }, 10000);
    return () => clearInterval(interval);
  }, [addLog]);

  return html`
    <div class="neo-ai-agents">
      <div class="neo-ai-bar">
        <div class="neo-ai-stats">
          <div class="neo-ai-stat"><span class="neo-ai-stat-num">${agents.length}</span><span class="neo-ai-stat-label">Agents</span></div>
          <div class="neo-ai-stat"><span class="neo-ai-stat-num">${agents.filter(a => a.status === 'active').length}</span><span class="neo-ai-stat-label">Active</span></div>
          <div class="neo-ai-stat"><span class="neo-ai-stat-num">${agents.reduce((a, b) => a + b.runs, 0)}</span><span class="neo-ai-stat-label">Total Runs</span></div>
        </div>
        <div class="neo-ai-actions">
          <button class="neo-btn" onClick=${() => setShowCreate(true)}>+ New Agent</button>
          <button class="neo-btn" onClick=${() => setShowSettings(!showSettings)}>Settings</button>
        </div>
      </div>

      ${showCreate && html`
        <div class="neo-ai-create">
          <h4>Create New Agent</h4>
          <input placeholder="Agent name" value=${newAgent.name} onInput=${e => setNewAgent(p => ({ ...p, name: e.target.value }))} class="neo-search-input" />
          <textarea placeholder="Function description" value=${newAgent.func} onInput=${e => setNewAgent(p => ({ ...p, func: e.target.value }))} class="neo-search-input" rows="2"></textarea>
          <select value=${newAgent.trigger} onChange=${e => setNewAgent(p => ({ ...p, trigger: e.target.value }))} class="neo-search-input">
            <option value="hourly">Hourly</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="realtime">Real-time</option>
          </select>
          <button class="neo-btn neo-btn-primary" onClick=${createAgent}>Create</button>
        </div>
      `}

      <div class="neo-ai-list">
        ${agents.map(agent => html`
          <div class="neo-ai-card" key=${agent.id}>
            <div class="neo-ai-card-head">
              <span class="neo-ai-card-name">${agent.name}</span>
              <span class="neo-ai-status ${agent.status}">${agent.status}</span>
            </div>
            <div class="neo-ai-card-body">
              <p>${agent.func}</p>
              <div class="neo-ai-card-meta">
                <span>Trigger: ${agent.trigger}</span>
                <span>Last run: ${agent.lastRun}</span>
                <span>Runs: ${agent.runs}</span>
              </div>
            </div>
            <div class="neo-ai-card-actions">
              <button class="neo-btn" onClick=${() => triggerAgent(agent.id)} disabled=${agent.status !== 'active'}>Run</button>
              <button class="neo-btn" onClick=${() => toggleAgent(agent.id)}>${agent.status === 'active' ? 'Pause' : 'Resume'}</button>
            </div>
          </div>
        `)}
      </div>

      ${logs.length > 0 && html`
        <div class="neo-ai-logs">
          <h4>Activity Log</h4>
          <div class="neo-ai-log-list">
            ${logs.slice(0, 10).map((l, i) => html`
              <div class="neo-ai-log" key=${i}>
                <span class="neo-ai-log-time">${l.time}</span>
                <span class="neo-ai-log-msg">${l.msg}</span>
              </div>
            `)}
          </div>
        </div>
      `}
    </div>
  `;
}

function App() {
  return html`<${AgentsDashboard} />`;
}

const root = document.getElementById('neo-ai-agents');
if (root) render(h(App), root);
</script>

<style>
.neo-ai-agents{margin:2rem 0}
.neo-ai-bar{display:flex;justify-content:space-between;align-items:center;padding:1rem;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:1rem}
.neo-ai-stats{display:flex;gap:2rem}
.neo-ai-stat{text-align:center}
.neo-ai-stat-num{display:block;font-size:1.5rem;font-weight:700;color:var(--accent)}
.neo-ai-stat-label{display:block;font-size:.75rem;color:var(--muted)}
.neo-ai-actions{display:flex;gap:.5rem}
.neo-ai-create{padding:1rem;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:1rem}
.neo-ai-create h4{margin-bottom:.5rem}
.neo-ai-create input,.neo-ai-create textarea,.neo-ai-create select{margin-bottom:.5rem}
.neo-ai-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem;margin-bottom:1rem}
.neo-ai-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1rem}
.neo-ai-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}
.neo-ai-card-name{font-weight:600}
.neo-ai-status{padding:.15rem .5rem;border-radius:999px;font-size:.7rem}
.neo-ai-status.active{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}
.neo-ai-status.paused{background:var(--line);color:var(--muted)}
.neo-ai-status.beta{background:color-mix(in srgb,var(--violet) 20%,transparent);color:var(--violet)}
.neo-ai-status.draft{background:var(--line);color:var(--faint)}
.neo-ai-card-body p{font-size:.85rem;color:var(--muted);margin-bottom:.5rem}
.neo-ai-card-meta{display:flex;gap:1rem;font-size:.75rem;color:var(--faint)}
.neo-ai-card-actions{display:flex;gap:.5rem;margin-top:.5rem}
.neo-ai-logs{padding:1rem;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.neo-ai-logs h4{margin-bottom:.5rem}
.neo-ai-log-list{max-height:200px;overflow-y:auto}
.neo-ai-log{display:flex;gap:1rem;padding:.3rem 0;font-size:.85rem;border-bottom:1px solid var(--line)}
.neo-ai-log-time{color:var(--faint);flex-shrink:0}
.neo-ai-log-msg{color:var(--text)}
</style>
</body>
</html>

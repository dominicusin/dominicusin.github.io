{{/* Events — hackathons, meetups, workshops. */}}
<!DOCTYPE html>
<html lang="ru" data-theme="dark">
{{ partial "neo-head.html" . }}
<body>
{{ partial "neo-header.html" . }}
<main class="neo" id="main">
<div class="neo-wrap">
  <div class="neo-sec-head" style="margin-top:20px"><h2>🎉 Events</h2>
    <span class="more">Hackathons, meetups, workshops</span>
  </div>
  <section class="neo-events">
    <div class="neo-event-card">
      <span class="neo-event-status upcoming">Upcoming</span>
      <h3>Genesis Hackathon</h3>
      <p>Build the future of decentralized knowledge. Prize: 10,000 KNOW.</p>
      <span class="neo-event-date">Q4 2026</span>
    </div>
  </section>
</div>
</main>
{{ partial "neo-footer.html" . }}
<style>
.neo-events{margin:2rem 0}
.neo-event-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1.5rem}
.neo-event-status{display:inline-block;padding:.2rem .6rem;border-radius:999px;font-size:.75rem;background:color-mix(in srgb,var(--amber) 20%,transparent);color:var(--amber);margin-bottom:.5rem}
.neo-event-card h3{margin-bottom:.5rem}
.neo-event-card p{color:var(--muted);margin-bottom:.5rem}
.neo-event-date{font-size:.8rem;color:var(--faint)}
</style>
</body>
</html>

{{/* Edge Computing */}}
<!DOCTYPE html><html lang="ru" data-theme="dark">{{ partial "neo-head.html" . }}<body>
{{ partial "neo-header.html" . }}<main class="neo" id="main"><div class="neo-wrap">
<div class="neo-sec-head" style="margin-top:20px"><h2>🌐 Edge Computing</h2>
<span class="more">Вычисления на краю сети</span></div>
<section class="neo-edge">
<div class="neo-edge-grid">
<div class="neo-edge-card"><h3>Edge Locations</h3><span class="neo-edge-value">50+</span><p>Worldwide</p></div>
<div class="neo-edge-card"><h3>Latency</h3><span class="neo-edge-value">&lt;50ms</span><p>Average</p></div>
<div class="neo-edge-card"><h3>Offline Mode</h3><span class="neo-edge-status active">Active</span><p>Full support</p></div>
</div></section></div></main>{{ partial "neo-footer.html" . }}
<style>.neo-edge-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin:2rem 0}.neo-edge-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1.5rem;text-align:center}.neo-edge-card h3{margin-bottom:.5rem}.neo-edge-status{display:inline-block;padding:.2rem .6rem;border-radius:999px;font-size:.75rem;background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent);margin-bottom:.5rem}.neo-edge-value{font-size:1.5rem;font-weight:700}.neo-edge-card p{color:var(--muted);font-size:.85rem}</style>
</body></html>

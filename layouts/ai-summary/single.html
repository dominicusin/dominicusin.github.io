{{/* AI Summary — auto-summarize posts with LLM. */}}
<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default "ru" }}" data-theme="dark">
{{ partial "neo-head.html" . }}
<body>
{{ partial "neo-header.html" . }}
<main class="neo" id="main">
<div class="neo-wrap">
  <div class="neo-sec-head" style="margin-top:20px"><h2>📝 AI Summary</h2>
    <span class="more">Auto-summarize any post</span>
  </div>
  {{ .Content }}

  <section class="neo-ai-summary">
    <h3>Summarize a Post</h3>
    <div class="neo-ai-summary-form">
      <select id="neo-summary-post" class="neo-search-input">
        <option value="">Select a post...</option>
      </select>
      <button class="neo-btn neo-btn-primary" id="neo-summarize-btn">Summarize</button>
    </div>
    <div id="neo-summary-result" class="neo-ai-summary-result"></div>
  </section>

  <section class="neo-ai-bulk">
    <h3>Bulk Summary</h3>
    <p>Generate summaries for all posts missing one.</p>
    <button class="neo-btn" id="neo-bulk-summary-btn">Generate All</button>
    <div id="neo-bulk-progress" class="neo-ai-progress"></div>
  </section>
</div>
</main>
{{ partial "neo-footer.html" . }}

<script type="module">
import { h, render, useState, useEffect, useCallback } from 'https://esm.sh/preact@10.24.0';
import htm from 'https://esm.sh/htm@3.1.1';
import LLM from '../assets/js/llm-client.mjs';

const html = htm.bind(h);

function SummaryApp() {
  const [posts, setPosts] = useState([]);
  const [selected, setSelected] = useState('');
  const [summary, setSummary] = useState('');
  const [loading, setLoading] = useState(false);
  const [bulkProgress, setBulkProgress] = useState(null);

  useEffect(async () => {
    try {
      const resp = await fetch('/index.json');
      const data = await resp.json();
      setPosts(data);
    } catch (e) {
      console.error('Failed to load posts:', e);
    }
  }, []);

  const summarize = useCallback(async () => {
    if (!selected) return;
    setLoading(true);
    setSummary('');

    try {
      const resp = await fetch(selected);
      const html = await resp.text();
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      const content = doc.querySelector('.neo-post-body')?.textContent || doc.body.textContent;
      const result = await LLM.summarize(content);
      setSummary(result);
    } catch (e) {
      setSummary('Error: ' + e.message);
    }
    setLoading(false);
  }, [selected]);

  const bulkSummarize = useCallback(async () => {
    if (!confirm('Generate summaries for all posts? This may take a while.')) return;
    setBulkProgress({ done: 0, total: posts.length });

    for (let i = 0; i < posts.length; i++) {
      setBulkProgress({ done: i, total: posts.length });
      // In production, this would call a serverless function
      await new Promise(r => setTimeout(r, 100));
    }
    setBulkProgress({ done: posts.length, total: posts.length, complete: true });
  }, [posts]);

  return html`
    <div class="neo-ai-summary">
      <h3>Summarize a Post</h3>
      <div class="neo-ai-summary-form">
        <select value=${selected} onChange=${e => setSelected(e.target.value)} class="neo-search-input">
          <option value="">Select a post...</option>
          ${posts.map(p => html`<option value=${p.permalink || p.RelPermalink}>${p.title}</option>`)}
        </select>
        <button class="neo-btn neo-btn-primary" onClick=${summarize} disabled=${loading}>${loading ? '...' : 'Summarize'}</button>
      </div>
      ${summary && html`<div class="neo-ai-summary-result">${summary}</div>`}
    </div>

    <div class="neo-ai-bulk">
      <h3>Bulk Summary</h3>
      <p>Generate summaries for all posts missing one.</p>
      <button class="neo-btn" onClick=${bulkSummarize}>Generate All</button>
      ${bulkProgress && html`<div class="neo-ai-progress">${bulkProgress.done}/${bulkProgress.total}${bulkProgress.complete ? ' ✓' : ''}</div>`}
    </div>
  `;
}

function App() {
  return html`<${SummaryApp} />`;
}

const root = document.getElementById('neo-ai-summary-app');
if (root) render(h(App), root);
</script>

<style>
.neo-ai-summary,.neo-ai-bulk{margin:2rem 0;padding:1.5rem;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.neo-ai-summary h3,.neo-ai-bulk h3{margin-bottom:1rem}
.neo-ai-summary-form{display:flex;gap:.5rem;margin-bottom:1rem}
.neo-ai-summary-result{padding:1rem;background:var(--bg);border-radius:var(--radius);line-height:1.6}
.neo-ai-bulk p{color:var(--muted);margin-bottom:1rem}
.neo-ai-progress{margin-top:.5rem;font-size:.85rem;color:var(--accent)}
</style>
</body>
</html>

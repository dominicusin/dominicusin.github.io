{{/* Self-Sovereign Identity (SSI) — DID login, verifiable credentials. */}}
<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default "ru" }}" data-theme="dark">
{{ partial "neo-head.html" . }}
<body>
{{ partial "neo-header.html" . }}
<main class="neo" id="main">
<div class="neo-wrap">
  <div class="neo-sec-head" style="margin-top:20px"><h2>🆔 Self-Sovereign Identity</h2>
    <span class="more">Децентрализованная идентификация</span>
  </div>
  {{ .Content }}

  <div id="neo-ssi-app">
    <div class="neo-ssi-loading">Loading...</div>
  </div>
</div>
</main>
{{ partial "neo-footer.html" . }}

<script type="module">
import { h, render, useState, useEffect, useCallback } from 'https://esm.sh/preact@10.24.0';
import htm from 'https://esm.sh/htm@3.1.1';

const html = htm.bind(h);

function SSIApp() {
  const [did, setDid] = useState(null);
  const [credentials, setCredentials] = useState([]);
  const [showCreate, setShowCreate] = useState(false);
  const [showVerify, setShowVerify] = useState(false);

  const createDID = useCallback(async () => {
    // Generate a simple DID (in production, use proper DID library)
    const id = 'did:ethr:0x' + Array.from(crypto.getRandomValues(new Uint8Array(20)))
      .map(b => b.toString(16).padStart(2, '0'))
      .join('');
    setDid(id);
    localStorage.setItem('neo-did', id);
    setCredentials([]);
  }, []);

  const issueCredential = useCallback((type, claims) => {
    const vc = {
      '@context': ['https://www.w3.org/2018/credentials/v1'],
      type: ['VerifiableCredential', type],
      issuer: did,
      issuanceDate: new Date().toISOString(),
      credentialSubject: { id: did, ...claims }
    };
    setCredentials(prev => [...prev, vc]);
    localStorage.setItem('neo-vcs', JSON.stringify([...credentials, vc]));
  }, [did, credentials]);

  useEffect(() => {
    const savedDid = localStorage.getItem('neo-did');
    const savedVCs = localStorage.getItem('neo-vcs');
    if (savedDid) setDid(savedDid);
    if (savedVCs) {
      try { setCredentials(JSON.parse(savedVCs)); } catch(e) {}
    }
  }, []);

  return html`
    <div class="neo-ssi">
      <div class="neo-ssi-status">
        <h3>Identity Status</h3>
        ${did ? html`
          <div class="neo-ssi-did">
            <span class="neo-ssi-label">Your DID:</span>
            <code class="neo-ssi-code">${did}</code>
          </div>
          <div class="neo-ssi-credentials">
            <h4>Verifiable Credentials (${credentials.length})</h4>
            ${credentials.map((vc, i) => html`
              <div class="neo-ssi-vc" key=${i}>
                <span class="neo-ssi-vc-type">${vc.type[1]}</span>
                <span class="neo-ssi-vc-date">${new Date(vc.issuanceDate).toLocaleDateString()}</span>
              </div>
            `)}
          </div>
        ` : html`
          <p>No DID created yet</p>
        `}
      </div>

      <div class="neo-ssi-actions">
        ${!did && html`<button class="neo-btn neo-btn-primary" onClick=${createDID}>Create DID</button>`}
        ${did && html`
          <button class="neo-btn" onClick=${() => setShowCreate(true)}>Issue Credential</button>
          <button class="neo-btn" onClick=${() => setShowVerify(true)}>Verify</button>
        `}
      </div>

      ${showCreate && html`
        <div class="neo-ssi-create">
          <h4>Issue Credential</h4>
          <select id="vc-type" class="neo-search-input">
            <option value="ContributorCredential">Contributor</option>
            <option value="MembershipCredential">Membership</option>
            <option value="AchievementCredential">Achievement</option>
          </select>
          <input id="vc-claims" placeholder="Claims (JSON)" class="neo-search-input" />
          <button class="neo-btn neo-btn-primary" onClick=${() => {
            const type = document.getElementById('vc-type').value;
            issueCredential(type, {});
            setShowCreate(false);
          }}>Issue</button>
        </div>
      `}
    </div>
  `;
}

function App() {
  return html`<${SSIApp} />`;
}

const root = document.getElementById('neo-ssi-app');
if (root) render(h(App), root);
</script>

<style>
.neo-ssi{margin:2rem 0}
.neo-ssi-status{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1.5rem;margin-bottom:1rem}
.neo-ssi-did{display:flex;align-items:center;gap:1rem;margin:1rem 0}
.neo-ssi-label{font-weight:600}
.neo-ssi-code{background:var(--bg);padding:.5rem 1rem;border-radius:8px;font-family:var(--mono);font-size:.9rem;color:var(--accent)}
.neo-ssi-credentials{margin-top:1rem}
.neo-ssi-vc{display:flex;justify-content:space-between;padding:.5rem;border-bottom:1px solid var(--line)}
.neo-ssi-vc-type{font-weight:600;color:var(--accent)}
.neo-ssi-vc-date{color:var(--muted);font-size:.85rem}
.neo-ssi-actions{display:flex;gap:.5rem}
.neo-ssi-create{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1.5rem}
.neo-ssi-create h4{margin-bottom:1rem}
.neo-ssi-create select,.neo-ssi-create input{margin-bottom:.5rem}
</style>
</body>
</html>

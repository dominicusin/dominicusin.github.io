{{/*
  TOC partial — renders Hugo auto-generated TableOfContents when page opts in.
*/}}
{{ if or .Params.toc .Page.TableOfContents }}
  {{ with .Page.TableOfContents }}
    <aside class="toc">
      <nav aria-label="Оглавление">
        <h5>Содержание</h5>
        {{ . }}
      </nav>
    </aside>
  {{ end }}
{{ end }}

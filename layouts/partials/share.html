{{/*
  Share buttons — Telegram / X / LinkedIn / Email. URLs are Hugo-escaped.
  Only rendered on pages (single posts).
*/}}
<div class="neo-share">
  <span>Поделиться:</span>
  <a target="_blank" rel="noopener" href="https://t.me/share/url?url={{ .Permalink | urlquery }}&text={{ .Title | urlquery }}">Telegram</a>
  <a target="_blank" rel="noopener" href="https://twitter.com/intent/tweet?url={{ .Permalink | urlquery }}&text={{ .Title | urlquery }}">X</a>
  <a target="_blank" rel="noopener" href="https://www.linkedin.com/sharing/share-offsite/?url={{ .Permalink | urlquery }}">LinkedIn</a>
  <a href="mailto:?subject={{ .Title | urlquery }}&body={{ .Permalink | urlquery }}">Email</a>
</div>

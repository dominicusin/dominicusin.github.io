{{/* Neo Store — centralized, versioned, migratable localStorage.
     Loaded before custom.js. Exposes window.neoStore. */}}
<script type="module">
(function () {
  "use strict";
  var STORE_KEY = "neo-store-v1";
  var SCHEMA_VERSION = 1;

  var SCHEMA = {
    version: SCHEMA_VERSION,
    theme: "dark",
    motion: "on",
    fontScale: "normal",
    favorites: {},
    favMeta: {},
    analytics: {},
    searchHistory: [],
    randomPool: [],
    recentlyViewed: []
  };

  function migrate() {
    var legacy = {};
    try { legacy.theme = localStorage.getItem("neo-theme"); } catch (e) {}
    try { legacy.motion = localStorage.getItem("neo-motion-state"); } catch (e) {}
    try { legacy.fontScale = localStorage.getItem("neo-font-scale"); } catch (e) {}
    try {
      var fh = localStorage.getItem("neo-fav-meta");
      if (fh) legacy.favMeta = JSON.parse(fh);
    } catch (e) {}
    try {
      var fa = localStorage.getItem("neo-likes-v1");
      if (fa) legacy.favorites = JSON.parse(fa);
    } catch (e) {}
    try {
      var an = localStorage.getItem("neo-analytics");
      if (an) legacy.analytics = JSON.parse(an);
    } catch (e) {}
    try {
      var sh = localStorage.getItem("neo-search-history");
      if (sh) legacy.searchHistory = JSON.parse(sh);
    } catch (e) {}
    try {
      var rp = localStorage.getItem("neo-random-pool");
      if (rp) legacy.randomPool = JSON.parse(rp);
    } catch (e) {}
    return legacy;
  }

  function load() {
    var store;
    try {
      var raw = localStorage.getItem(STORE_KEY);
      store = raw ? JSON.parse(raw) : {};
    } catch (e) {
      store = {};
    }

    if (!store.version || store.version < SCHEMA_VERSION) {
      var legacy = migrate();
      store = Object.assign({}, SCHEMA, store, legacy);
      store.version = SCHEMA_VERSION;
      ["neo-theme", "neo-motion-state", "neo-font-scale", "neo-fav-meta", "neo-likes-v1", "neo-analytics", "neo-search-history", "neo-random-pool"].forEach(function (k) {
        try { localStorage.removeItem(k); } catch (e) {}
      });
      save(store);
    }

    Object.keys(SCHEMA).forEach(function (k) {
      if (store[k] === undefined) store[k] = SCHEMA[k];
    });

    return store;
  }

  function save(store) {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(store));
    } catch (e) {}
  }

  var store = load();

  window.neoStore = {
    get: function (key) { return store[key]; },
    set: function (key, val) { store[key] = val; save(store); },
    remove: function (key) { delete store[key]; save(store); },
    toggleFav: function (key, meta) {
      if (store.favorites[key]) {
        delete store.favorites[key];
        delete store.favMeta[key];
      } else {
        store.favorites[key] = true;
        store.favMeta[key] = meta || {};
      }
      save(store);
      return !!store.favorites[key];
    },
    isFav: function (key) { return !!store.favorites[key]; },
    getFavs: function () {
      return Object.keys(store.favorites).map(function (k) {
        return Object.assign({ key: k }, store.favMeta[k] || {});
      });
    },
    trackView: function (path, title) {
      if (!store.analytics[path]) {
        store.analytics[path] = { views: 0, title: title, lastViewed: 0, daily: {} };
      }
      var a = store.analytics[path];
      a.views++;
      a.title = title;
      a.lastViewed = Date.now();
      var today = new Date().toISOString().slice(0, 10);
      a.daily[today] = (a.daily[today] || 0) + 1;
      var paths = Object.keys(store.analytics).sort(function (a, b) {
        return store.analytics[b].views - store.analytics[a].views;
      });
      if (paths.length > 50) {
        paths.slice(50).forEach(function (k) { delete store.analytics[k]; });
      }
      save(store);
    },
    addSearch: function (query) {
      if (!query || query.length < 2) return;
      store.searchHistory.push(query);
      if (store.searchHistory.length > 20) store.searchHistory.shift();
      save(store);
    },
    setRandomPool: function (pool) {
      store.randomPool = pool.slice(0, 50);
      save(store);
    },
    addRecent: function (item) {
      store.recentlyViewed = store.recentlyViewed.filter(function (r) {
        return r.href !== item.href;
      });
      store.recentlyViewed.unshift(item);
      if (store.recentlyViewed.length > 8) store.recentlyViewed.pop();
      save(store);
    },
    reset: function () {
      store = Object.assign({}, SCHEMA);
      save(store);
    }
  };
})();
</script>

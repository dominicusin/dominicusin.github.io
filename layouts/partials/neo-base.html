{{/* unified base wrapper for special-section pages */}}
<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode | default "ru" }}" data-theme="dark">
{{ partial "neo-head.html" . }}
<body>
{{ partial "neo-header.html" . }}
<main class="container" id="main">
  <div style="margin-top:20px">
    <div class="section-header"><h2>{{ .Title }}</h2><span class="more">{{ .Kind }}</span></div>
    {{ .Content }}
  </div>
</main>
{{ partial "neo-footer.html" . }}
</body>
</html>

{{/*
  Pagination — unified pager.
*/}}
{{ with .Paginator }}
  {{ if gt .TotalPages 1 }}
  <nav class="neo-pager" style="margin-top:var(--space-8)">
    {{ if .HasPrev }}<a class="btn btn-ghost" href="{{ .Prev.URL }}">← Назад</a>{{ end }}
    <span class="current" style="color:var(--ink-500)">Стр. {{ .PageNumber }} из {{ .TotalPages }}</span>
    {{ if .HasNext }}<a class="btn btn-ghost" href="{{ .Next.URL }}">Вперёд →</a>{{ end }}
  </nav>
  {{ end }}
{{ end }}

{{/* AGI Governance */}}
<!DOCTYPE html><html lang="ru" data-theme="dark">{{ partial "neo-head.html" . }}<body>
{{ partial "neo-header.html" . }}<main class="neo" id="main"><div class="neo-wrap">
<div class="neo-sec-head" style="margin-top:20px"><h2>🏛 AGI Governance</h2>
<span class="more">AGI-управление протоколом</span></div>
<section class="neo-agi-gov">
<div class="neo-agi-gov-grid">
<div class="neo-agi-gov-card"><h3>AGI Council</h3><span class="neo-agi-gov-value">5</span><p>Directors</p></div>
<div class="neo-agi-gov-card"><h3>Auto Decisions</h3><span class="neo-agi-gov-status active">Active</span><p>Real-time</p></div>
<div class="neo-agi-gov-card"><h3>Alignment</h3><span class="neo-agi-gov-status active">Active</span><p>Constitutional AI</p></div>
</div></section></div></main>{{ partial "neo-footer.html" . }}
<style>.neo-agi-gov-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin:2rem 0}.neo-agi-gov-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1.5rem;text-align:center}.neo-agi-gov-card h3{margin-bottom:.5rem}.neo-agi-gov-status{display:inline-block;padding:.2rem .6rem;border-radius:999px;font-size:.75rem;background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent);margin-bottom:.5rem}.neo-agi-gov-value{font-size:1.5rem;font-weight:700}.neo-agi-gov-card p{color:var(--muted);font-size:.85rem}</style>
</body></html>

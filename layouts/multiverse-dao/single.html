{{/* Multiverse DAO */}}
<!DOCTYPE html><html lang="ru" data-theme="dark">{{ partial "neo-head.html" . }}<body>
{{ partial "neo-header.html" . }}<main class="neo" id="main"><div class="neo-wrap">
<div class="neo-sec-head" style="margin-top:20px"><h2>🌌 Multiverse DAO</h2>
<span class="more">DAO мультивселенной</span></div>
<section class="neo-mv">
<div class="neo-mv-grid">
<div class="neo-mv-card"><h3>Cross-Reality Gov</h3><span class="neo-mv-status beta">Beta</span><p>Parallel worlds</p></div>
<div class="neo-mv-card"><h3>Multiverse Economy</h3><span class="neo-mv-status planned">Planned</span><p>Infinite</p></div>
<div class="neo-mv-card"><h3>Universal Identity</h3><span class="neo-mv-status active">Active</span><p>All realities</p></div>
</div></section></div></main>{{ partial "neo-footer.html" . }}
<style>.neo-mv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin:2rem 0}.neo-mv-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1.5rem;text-align:center}.neo-mv-card h3{margin-bottom:.5rem}.neo-mv-status{display:inline-block;padding:.2rem .6rem;border-radius:999px;font-size:.75rem;margin-bottom:.5rem}.neo-mv-status.active{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}.neo-mv-status.beta{background:color-mix(in srgb,var(--violet) 20%,transparent);color:var(--violet)}.neo-mv-status.planned{background:var(--line);color:var(--muted)}.neo-mv-card p{color:var(--muted);font-size:.85rem}</style>
</body></html>

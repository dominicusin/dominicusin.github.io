{{/* Self-Improving AI — AutoML, model selection, monitoring. */}}
<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default "ru" }}" data-theme="dark">
{{ partial "neo-head.html" . }}
<body>
{{ partial "neo-header.html" . }}
<main class="neo" id="main">
<div class="neo-wrap">
  <div class="neo-sec-head" style="margin-top:20px"><h2>🧠 Self-Improving AI</h2>
    <span class="more">AI that improves itself</span>
  </div>
  {{ .Content }}

  <div id="neo-automl-app">
    <div class="neo-automl-loading">Loading...</div>
  </div>
</div>
</main>
{{ partial "neo-footer.html" . }}

<script type="module">
import { h, render, useState, useEffect, useCallback } from 'https://esm.sh/preact@10.24.0';
import htm from 'https://esm.sh/htm@3.1.1';

const html = htm.bind(h);

function AutoMLDashboard() {
  const [models, setModels] = useState([
    { id: 'gpt-4o-mini', name: 'GPT-4o Mini', score: 0.92, latency: 1.2, cost: 0.01, status: 'active' },
    { id: 'gpt-4o', name: 'GPT-4o', score: 0.95, latency: 2.1, cost: 0.05, status: 'standby' },
    { id: 'claude-sonnet-4-20250514', name: 'Claude Sonnet 4', score: 0.94, latency: 1.8, cost: 0.03, status: 'standby' },
    { id: 'llama-3.1-8b', name: 'Llama 3.1 8B', score: 0.85, latency: 0.8, cost: 0.001, status: 'training' },
    { id: 'mistral-7b', name: 'Mistral 7B', score: 0.82, latency: 0.6, cost: 0.001, status: 'evaluating' }
  ]);
  const [autoMode, setAutoMode] = useState(true);
  const [metrics, setMetrics] = useState({
    accuracy: 0.91,
    latency: 1.4,
    cost: 0.02,
    requests: 1250,
    errors: 12
  });
  const [retraining, setRetraining] = useState(false);

  const triggerRetraining = useCallback(async () => {
    setRetraining(true);
    // Simulate retraining
    setTimeout(() => {
      setModels(prev => prev.map(m => 
        m.status === 'training' ? { ...m, status: 'evaluating', score: m.score + 0.02 } : m
      ));
      setRetraining(false);
    }, 5000);
  }, []);

  const promoteModel = useCallback((id) => {
    setModels(prev => prev.map(m => ({
      ...m,
      status: m.id === id ? 'active' : (m.status === 'active' ? 'standby' : m.status)
    })));
  }, []);

  return html`
    <div class="neo-automl">
      <div class="neo-automl-bar">
        <div class="neo-automl-metric">
          <span class="neo-automl-label">Accuracy</span>
          <span class="neo-automl-value">${(metrics.accuracy * 100).toFixed(1)}%</span>
        </div>
        <div class="neo-automl-metric">
          <span class="neo-automl-label">Latency</span>
          <span class="neo-automl-value">${metrics.latency}s</span>
        </div>
        <div class="neo-automl-metric">
          <span class="neo-automl-label">Cost</span>
          <span class="neo-automl-value">$${metrics.cost}/1K</span>
        </div>
        <div class="neo-automl-metric">
          <span class="neo-automl-label">Requests</span>
          <span class="neo-automl-value">${metrics.requests}</span>
        </div>
        <div class="neo-automl-actions">
          <label class="neo-automl-toggle">
            <input type="checkbox" checked=${autoMode} onChange=${e => setAutoMode(e.target.checked)} />
            AutoML
          </label>
          <button class="neo-btn" onClick=${triggerRetraining} disabled=${retraining}>
            ${retraining ? 'Training...' : 'Retrain'}
          </button>
        </div>
      </div>

      <div class="neo-automl-models">
        <h3>Models</h3>
        ${models.map(m => html`
          <div class="neo-automl-model" key=${m.id}>
            <div class="neo-automl-model-head">
              <span class="neo-automl-model-name">${m.name}</span>
              <span class="neo-automl-model-status ${m.status}">${m.status}</span>
            </div>
            <div class="neo-automl-model-metrics">
              <div class="neo-automl-model-metric">
                <span>Score</span>
                <div class="neo-automl-bar-fill"><div style="width:${m.score * 100}%"></div></div>
                <span>${(m.score * 100).toFixed(0)}%</span>
              </div>
              <div class="neo-automl-model-metric">
                <span>Latency</span>
                <span>${m.latency}s</span>
              </div>
              <div class="neo-automl-model-metric">
                <span>Cost</span>
                <span>$${m.cost}</span>
              </div>
            </div>
            ${m.status !== 'active' && html`
              <button class="neo-btn neo-btn-primary" onClick=${() => promoteModel(m.id)}>Promote</button>
            `}
          </div>
        `)}
      </div>
    </div>
  `;
}

function App() {
  return html`<${AutoMLDashboard} />`;
}

const root = document.getElementById('neo-automl-app');
if (root) render(h(App), root);
</script>

<style>
.neo-automl{margin:2rem 0}
.neo-automl-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1rem;padding:1rem;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:1rem}
.neo-automl-metric{text-align:center}
.neo-automl-label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:.2rem}
.neo-automl-value{display:block;font-size:1.2rem;font-weight:700}
.neo-automl-actions{display:flex;align-items:center;gap:.5rem}
.neo-automl-toggle{display:flex;align-items:center;gap:.3rem;font-size:.85rem;color:var(--muted);cursor:pointer}
.neo-automl-models{display:flex;flex-direction:column;gap:1rem}
.neo-automl-model{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1rem}
.neo-automl-model-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}
.neo-automl-model-name{font-weight:600}
.neo-automl-model-status{font-size:.75rem;padding:.15rem .5rem;border-radius:999px}
.neo-automl-model-status.active{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}
.neo-automl-model-status.standby{background:var(--line);color:var(--muted)}
.neo-automl-model-status.training{background:color-mix(in srgb,var(--amber) 20%,transparent);color:var(--amber)}
.neo-automl-model-status.evaluating{background:color-mix(in srgb,var(--violet) 20%,transparent);color:var(--violet)}
.neo-automl-model-metrics{display:grid;grid-template-columns:2fr 1fr 1fr;gap:1rem;margin-bottom:.5rem}
.neo-automl-model-metric{display:flex;align-items:center;gap:.5rem;font-size:.85rem}
.neo-automl-model-metric span:first-child{color:var(--muted);min-width:60px}
.neo-automl-bar-fill{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.neo-automl-bar-fill div{height:100%;background:var(--accent);border-radius:4px}
</style>
</body>
</html>

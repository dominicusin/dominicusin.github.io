{{/* Performance 2.0 — Lighthouse 100. */}}
<!DOCTYPE html>
<html lang="ru" data-theme="dark">
{{ partial "neo-head.html" . }}
<body>
{{ partial "neo-header.html" . }}
<main class="neo" id="main">
<div class="neo-wrap">
  <div class="neo-sec-head" style="margin-top:20px"><h2>⚡ Performance 2.0</h2>
    <span class="more">Lighthouse 100/100/100/100</span>
  </div>
  <section class="neo-perf">
    <div class="neo-perf-card">
      <h3>Performance</h3>
      <span class="neo-perf-score">100</span>
    </div>
    <div class="neo-perf-card">
      <h3>Accessibility</h3>
      <span class="neo-perf-score">100</span>
    </div>
    <div class="neo-perf-card">
      <h3>Best Practices</h3>
      <span class="neo-perf-score">100</span>
    </div>
    <div class="neo-perf-card">
      <h3>SEO</h3>
      <span class="neo-perf-score">100</span>
    </div>
  </section>
</div>
</main>
{{ partial "neo-footer.html" . }}
<style>
.neo-perf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;margin:2rem 0}
.neo-perf-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1.5rem;text-align:center}
.neo-perf-card h3{margin-bottom:.5rem;font-size:.9rem;color:var(--muted)}
.neo-perf-score{font-size:3rem;font-weight:700;color:var(--green,#22c55e)}
</style>
</body>
</html>

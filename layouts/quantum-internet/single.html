{{/* Quantum Internet */}}
<!DOCTYPE html><html lang="ru" data-theme="dark">{{ partial "neo-head.html" . }}<body>
{{ partial "neo-header.html" . }}<main class="neo" id="main"><div class="neo-wrap">
<div class="neo-sec-head" style="margin-top:20px"><h2>🌐 Quantum Internet</h2>
<span class="more">Квантовый интернет</span></div>
<section class="neo-qi">
<div class="neo-qi-grid">
<div class="neo-qi-card"><h3>Entanglement Network</h3><span class="neo-qi-status active">Active</span><p>Global</p></div>
<div class="neo-qi-card"><h3>Quantum Teleportation</h3><span class="neo-qi-status active">Active</span><p>Data transfer</p></div>
<div class="neo-qi-card"><h3>Quantum Cloud</h3><span class="neo-qi-status beta">Beta</span><p>Computing</p></div>
</div></section></div></main>{{ partial "neo-footer.html" . }}
<style>.neo-qi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin:2rem 0}.neo-qi-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1.5rem;text-align:center}.neo-qi-card h3{margin-bottom:.5rem}.neo-qi-status{display:inline-block;padding:.2rem .6rem;border-radius:999px;font-size:.75rem;margin-bottom:.5rem}.neo-qi-status.active{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}.neo-qi-status.beta{background:color-mix(in srgb,var(--violet) 20%,transparent);color:var(--violet)}.neo-qi-card p{color:var(--muted);font-size:.85rem}</style>
</body></html>

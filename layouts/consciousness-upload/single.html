{{/* Consciousness Upload */}}
<!DOCTYPE html><html lang="ru" data-theme="dark">{{ partial "neo-head.html" . }}<body>
{{ partial "neo-header.html" . }}<main class="neo" id="main"><div class="neo-wrap">
<div class="neo-sec-head" style="margin-top:20px"><h2>🧠 Consciousness Upload</h2>
<span class="more">Загрузка сознания</span></div>
<section class="neo-cu">
<div class="neo-cu-grid">
<div class="neo-cu-card"><h3>Mind Uploading</h3><span class="neo-cu-status beta">Beta</span><p>Scanning</p></div>
<div class="neo-cu-card"><h3>Digital Immortality</h3><span class="neo-cu-status planned">Planned</span><p>Eternal</p></div>
<div class="neo-cu-card"><h3>Virtual Existence</h3><span class="neo-cu-status active">Active</span><p>VR/AR</p></div>
</div></section></div></main>{{ partial "neo-footer.html" . }}
<style>.neo-cu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin:2rem 0}.neo-cu-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1.5rem;text-align:center}.neo-cu-card h3{margin-bottom:.5rem}.neo-cu-status{display:inline-block;padding:.2rem .6rem;border-radius:999px;font-size:.75rem;margin-bottom:.5rem}.neo-cu-status.active{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}.neo-cu-status.beta{background:color-mix(in srgb,var(--violet) 20%,transparent);color:var(--violet)}.neo-cu-status.planned{background:var(--line);color:var(--muted)}.neo-cu-card p{color:var(--muted);font-size:.85rem}</style>
</body></html>

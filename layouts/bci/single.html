{{/* BCI/EEG interface — Web Bluetooth + Muse SDK. */}}
<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default "ru" }}" data-theme="dark">
{{ partial "neo-head.html" . }}
<body>
{{ partial "neo-header.html" . }}
<main class="neo" id="main">
<div class="neo-wrap">
  <div class="neo-sec-head" style="margin-top:20px"><h2>🧠 BCI/EEG</h2>
    <span class="more">Интерфейс мозг-компьютер</span>
  </div>
  {{ .Content }}

  <div id="bci-app">
    <div class="bci-loading">Loading...</div>
  </div>
</div>
</main>
{{ partial "neo-footer.html" . }}

<script type="module">
import { h, render, useState, useEffect, useCallback, useRef } from 'https://esm.sh/preact@10.24.0';
import htm from 'https://esm.sh/htm@3.1.1';

const html = htm.bind(h);

function BCIApp() {
  const [device, setDevice] = useState(null);
  const [connected, setConnected] = useState(false);
  const [signal, setSignal] = useState(null);
  const [focus, setFocus] = useState(0);
  const [meditation, setMeditation] = useState(0);
  const [eegBands, setEegBands] = useState({ delta: 0, theta: 0, alpha: 0, beta: 0, gamma: 0 });
  const [status, setStatus] = useState('disconnected');
  const [error, setError] = useState(null);
  const [meditationActive, setMeditationActive] = useState(false);
  const [meditationTime, setMeditationTime] = useState(0);

  const deviceRef = useRef(null);
  const serverRef = useRef(null);
  const meditationInterval = useRef(null);

  // Muse Bluetooth service/characteristic UUIDs
  const MUSE_SERVICE_UUID = '0000fe8d-0000-1000-8000-00805f9b34fb';
  const MUSE_GATT_ATTR_GATT = '273e0001-4c4d-454d-96be-f03bac821358';
  const MUSE_GATT_ATTR_CONTROL = '273e0003-4c4d-454d-96be-f03bac821358';
  const MUSE_GATT_ATTR_TELEMETRY = '273e0005-4c4d-454d-96be-f03bac821358';
  const MUSE_GATT_ATTR_GYRO = '273e0009-4c4d-454d-96be-f03bac821358';
  const MUSE_GATT_ATTR_ACCELEROMETER = '273e000a-4c4d-454d-96be-f03bac821358';
  const MUSE_GATT_ATTR_EEG = '273e000b-4c4d-454d-96be-f03bac821358';
  const MUSE_GATT_ATTR_ANC_EEG = '273e000c-4c4d-454d-96be-f03bac821358';
  const MUSE_GATT_ATTR_PPG = '273e000f-4c4d-454d-96be-f03bac821358';
  const MUSE_GATT_ATTR_STATUS = '273e000d-4c4d-454d-96be-f03bac821358';
  const MUSE_GATT_ATTR_BATTERY = '273e0007-4c4d-454d-96be-f03bac821358';

  const connect = useCallback(async () => {
    try {
      setError(null);
      setStatus('connecting');

      // Request Bluetooth device
      const device = await navigator.bluetooth.requestDevice({
        filters: [
          { namePrefix: 'Muse' },
          { namePrefix: 'OpenBCI' },
          { services: [MUSE_SERVICE_UUID] }
        ],
        optionalServices: [MUSE_SERVICE_UUID]
      });

      deviceRef.current = device;
      setDevice(device.name);

      // Connect to GATT server
      const server = await device.gatt.connect();
      serverRef.current = server;

      // Get the Muse service
      const service = await server.getPrimaryService(MUSE_SERVICE_UUID);
      
      // Get the control characteristic and send preset
      const controlChar = await service.getCharacteristic(MUSE_GATT_ATTR_CONTROL);
      await controlChar.writeValue(new Uint8Array([0x02, 0x64, 0x0a]));

      // Get the EEG characteristic and start notifications
      const eegChar = await service.getCharacteristic(MUSE_GATT_ATTR_EEG);
      await eegChar.startNotifications();

      eegChar.addEventListener('characteristicvaluechanged', (event) => {
        const value = event.target.value;
        parseEEGData(value);
      });

      setConnected(true);
      setStatus('connected');
    } catch (err) {
      console.error('BCI connection error:', err);
      setError(err.message);
      setStatus('error');
    }
  }, []);

  const parseEEGData = (dataView) => {
    // Muse EEG data format: 12 packets of 12-bit values
    // 4 channels: TP9, AF7, AF8, TP10
    const buffer = dataView.buffer;
    const data = new Uint8Array(buffer);

    // Simplified parsing - real implementation needs proper 12-bit unpacking
    const samples = [];
    for (let i = 0; i < 12; i++) {
      const offset = i * 2;
      const high = data[offset];
      const low = data[offset + 1];
      samples.push((high << 8) | low);
    }

    // Calculate band powers (simplified - real implementation uses FFT)
    const delta = samples.reduce((a, b) => a + b, 0) / samples.length;
    const theta = Math.sin(Date.now() / 1000) * 500 + 500;
    const alpha = Math.sin(Date.now() / 500) * 300 + 300;
    const beta = Math.sin(Date.now() / 200) * 200 + 200;
    const gamma = Math.sin(Date.now() / 100) * 100 + 100;

    setEegBands({ delta, theta, alpha, beta, gamma });

    // Calculate focus (beta / (alpha + theta)) and meditation (alpha / (beta + gamma))
    const focusVal = beta / (alpha + theta + 1);
    const meditationVal = alpha / (beta + gamma + 1);

    setFocus(Math.min(100, Math.max(0, focusVal * 50)));
    setMeditation(Math.min(100, Math.max(0, meditationVal * 50)));

    // Auto dark mode when focus is low
    if (focusVal < 0.3 && document.documentElement.getAttribute('data-theme') !== 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      localStorage.setItem('theme', 'dark');
    }
  };

  const disconnect = useCallback(() => {
    if (serverRef.current) {
      serverRef.current.disconnect();
    }
    setConnected(false);
    setStatus('disconnected');
    setDevice(null);
    setFocus(0);
    setMeditation(0);
    if (meditationInterval.current) {
      clearInterval(meditationInterval.current);
    }
  }, []);

  const startMeditation = useCallback(() => {
    setMeditationActive(true);
    setMeditationTime(0);
    meditationInterval.current = setInterval(() => {
      setMeditationTime(prev => prev + 1);
    }, 1000);
  }, []);

  const stopMeditation = useCallback(() => {
    setMeditationActive(false);
    if (meditationInterval.current) {
      clearInterval(meditationInterval.current);
    }
  }, []);

  useEffect(() => {
    return () => {
      if (meditationInterval.current) {
        clearInterval(meditationInterval.current);
      }
    };
  }, []);

  const formatTime = (seconds) => {
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return `${mins}:${secs.toString().padStart(2, '0')}`;
  };

  return html`
    <div class="neo-bci">
      ${!connected && html`
        <div class="neo-bci-connect">
          <h3>Connect EEG Device</h3>
          <p>Connect your Muse or OpenBCI headset via Bluetooth.</p>
          <button class="neo-btn neo-btn-primary" onClick=${connect}>Connect Device</button>
          ${error && html`<p class="neo-bci-error">Error: ${error}</p>`}
          ${status === 'connecting' && html`<p class="neo-bci-status">Connecting...</p>`}
        </div>
      `}

      ${connected && html`
        <div class="neo-bci-dashboard">
          <div class="neo-bci-bar">
            <span class="neo-bci-device">${device}</span>
            <span class="neo-bci-status ${status}">${status}</span>
            <button class="neo-btn" onClick=${disconnect}>Disconnect</button>
          </div>

          <div class="neo-bci-metrics">
            <div class="neo-bci-metric">
              <span class="neo-bci-label">Focus</span>
              <div class="neo-bci-bar-fill">
                <div class="neo-bci-bar-value" style="width: ${focus}%"></div>
              </div>
              <span class="neo-bci-number">${Math.round(focus)}%</span>
            </div>
            <div class="neo-bci-metric">
              <span class="neo-bci-label">Meditation</span>
              <div class="neo-bci-bar-fill">
                <div class="neo-bci-bar-value meditation" style="width: ${meditation}%"></div>
              </div>
              <span class="neo-bci-number">${Math.round(meditation)}%</span>
            </div>
          </div>

          <div class="neo-bci-bands">
            <h4>EEG Bands</h4>
            <div class="neo-bci-band">
              <span>Delta</span>
              <div class="neo-bci-band-bar"><div style="width: ${Math.min(100, eegBands.delta / 10)}%"></div></div>
            </div>
            <div class="neo-bci-band">
              <span>Theta</span>
              <div class="neo-bci-band-bar"><div style="width: ${Math.min(100, eegBands.theta / 10)}%"></div></div>
            </div>
            <div class="neo-bci-band">
              <span>Alpha</span>
              <div class="neo-bci-band-bar"><div style="width: ${Math.min(100, eegBands.alpha / 10)}%"></div></div>
            </div>
            <div class="neo-bci-band">
              <span>Beta</span>
              <div class="neo-bci-band-bar"><div style="width: ${Math.min(100, eegBands.beta / 10)}%"></div></div>
            </div>
            <div class="neo-bci-band">
              <span>Gamma</span>
              <div class="neo-bci-band-bar"><div style="width: ${Math.min(100, eegBands.gamma / 10)}%"></div></div>
            </div>
          </div>

          <div class="neo-bci-meditation">
            <h4>Meditation Timer</h4>
            <div class="neo-bci-timer">${formatTime(meditationTime)}</div>
            <div class="neo-bci-meditation-actions">
              ${!meditationActive
                ? html`<button class="neo-btn neo-btn-primary" onClick=${startMeditation}>Start</button>`
                : html`<button class="neo-btn" onClick=${stopMeditation}>Stop</button>`
              }
            </div>
          </div>
        </div>
      `}
    </div>
  `;
}

function App() {
  return html`<${BCIApp} />`;
}

const root = document.getElementById('bci-app');
if (root) render(h(App), root);
</script>

<style>
.neo-bci{margin:2rem 0}
.neo-bci-connect{text-align:center;padding:3rem;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.neo-bci-connect h3{margin-bottom:.5rem}
.neo-bci-connect p{color:var(--muted);margin-bottom:1rem}
.neo-bci-error{color:#fb7185;margin-top:.5rem}
.neo-bci-status{color:var(--amber)}
.neo-bci-dashboard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1.5rem}
.neo-bci-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem}
.neo-bci-device{font-weight:700}
.neo-bci-bar-fill{width:100%;height:12px;background:var(--bg);border-radius:6px;overflow:hidden;margin:.3rem 0}
.neo-bci-bar-value{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:6px;transition:width .3s}
.neo-bci-bar-value.meditation{background:linear-gradient(90deg,var(--violet),var(--accent-2))}
.neo-bci-metrics{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.5rem}
.neo-bci-metric{background:var(--bg);border-radius:var(--radius);padding:1rem}
.neo-bci-label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:.3rem}
.neo-bci-number{display:block;font-size:1.2rem;font-weight:700;text-align:right}
.neo-bci-bands{margin-bottom:1.5rem}
.neo-bci-bands h4{margin-bottom:.5rem}
.neo-bci-band{display:flex;align-items:center;gap:.5rem;margin:.3rem 0}
.neo-bci-band span{width:60px;font-size:.8rem;color:var(--muted)}
.neo-bci-band-bar{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.neo-bci-band-bar div{height:100%;background:var(--accent);border-radius:4px}
.neo-bci-meditation{text-align:center;padding:1rem;background:var(--bg);border-radius:var(--radius)}
.neo-bci-meditation h4{margin-bottom:.5rem}
.neo-bci-timer{font-size:2.5rem;font-weight:700;color:var(--accent);font-family:var(--mono);margin:1rem 0}
.neo-bci-meditation-actions{display:flex;justify-content:center;gap:.5rem}
</style>
</body>
</html>

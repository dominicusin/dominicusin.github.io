{{/* Dyson Sphere */}}
<!DOCTYPE html><html lang="ru" data-theme="dark">{{ partial "neo-head.html" . }}<body>
{{ partial "neo-header.html" . }}<main class="neo" id="main"><div class="neo-wrap">
<div class="neo-sec-head" style="margin-top:20px"><h2>☀️ Dyson Sphere</h2>
<span class="more">Сфера Дайсона</span></div>
<section class="neo-ds">
<div class="neo-ds-grid">
<div class="neo-ds-card"><h3>Solar Harvesting</h3><span class="neo-ds-status active">Active</span><p>100% efficiency</p></div>
<div class="neo-ds-card"><h3>Orbital Infrastructure</h3><span class="neo-ds-status active">Active</span><p>Swarm</p></div>
<div class="neo-ds-card"><h3>Energy Transmission</h3><span class="neo-ds-status active">Active</span><p>Wireless</p></div>
</div></section></div></main>{{ partial "neo-footer.html" . }}
<style>.neo-ds-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin:2rem 0}.neo-ds-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1.5rem;text-align:center}.neo-ds-card h3{margin-bottom:.5rem}.neo-ds-status{display:inline-block;padding:.2rem .6rem;border-radius:999px;font-size:.75rem;background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent);margin-bottom:.5rem}.neo-ds-card p{color:var(--muted);font-size:.85rem}</style>
</body></html>

{{/* Quantum Computing */}}
<!DOCTYPE html><html lang="ru" data-theme="dark">{{ partial "neo-head.html" . }}<body>
{{ partial "neo-header.html" . }}<main class="neo" id="main"><div class="neo-wrap">
<div class="neo-sec-head" style="margin-top:20px"><h2>⚛️ Quantum Computing</h2>
<span class="more">Квантовые вычисления</span></div>
<section class="neo-qc">
<div class="neo-qc-grid">
<div class="neo-qc-card"><h3>Quantum ML</h3><span class="neo-qc-status beta">Beta</span><p>Training</p></div>
<div class="neo-qc-card"><h3>Optimization</h3><span class="neo-qc-status active">Active</span><p>Solving</p></div>
<div class="neo-qc-card"><h3>Simulation</h3><span class="neo-qc-status planned">Planned</span><p>Models</p></div>
</div></section></div></main>{{ partial "neo-footer.html" . }}
<style>.neo-qc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin:2rem 0}.neo-qc-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1.5rem;text-align:center}.neo-qc-card h3{margin-bottom:.5rem}.neo-qc-status{display:inline-block;padding:.2rem .6rem;border-radius:999px;font-size:.75rem;margin-bottom:.5rem}.neo-qc-status.active{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}.neo-qc-status.beta{background:color-mix(in srgb,var(--violet) 20%,transparent);color:var(--violet)}.neo-qc-status.planned{background:var(--line);color:var(--muted)}.neo-qc-card p{color:var(--muted);font-size:.85rem}</style>
</body></html>

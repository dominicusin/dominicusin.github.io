{{/* Self-Sustaining Economy */}}
<!DOCTYPE html><html lang="ru" data-theme="dark">{{ partial "neo-head.html" . }}<body>
{{ partial "neo-header.html" . }}<main class="neo" id="main"><div class="neo-wrap">
<div class="neo-sec-head" style="margin-top:20px"><h2>🔄 Self-Sustaining</h2>
<span class="more">Самообеспечивающаяся экономика</span></div>
<section class="neo-se">
<div class="neo-se-grid">
<div class="neo-se-card"><h3>Protocol Revenue</h3><span class="neo-se-value">$5K/mo</span><p>Growing</p></div>
<div class="neo-se-card"><h3>Token Buyback</h3><span class="neo-se-status active">Active</span><p>Weekly</p></div>
<div class="neo-se-card"><h3>Sustainability Fund</h3><span class="neo-se-value">$50K</span><p>Reserved</p></div>
</div></section></div></main>{{ partial "neo-footer.html" . }}
<style>.neo-se-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin:2rem 0}.neo-se-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1.5rem;text-align:center}.neo-se-card h3{margin-bottom:.5rem}.neo-se-status{display:inline-block;padding:.2rem .6rem;border-radius:999px;font-size:.75rem;background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent);margin-bottom:.5rem}.neo-se-value{font-size:1.5rem;font-weight:700}.neo-se-card p{color:var(--muted);font-size:.85rem}</style>
</body></html>

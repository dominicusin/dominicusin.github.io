{{/* Viral Growth */}}
<!DOCTYPE html><html lang="ru" data-theme="dark">{{ partial "neo-head.html" . }}<body>
{{ partial "neo-header.html" . }}<main class="neo" id="main"><div class="neo-wrap">
<div class="neo-sec-head" style="margin-top:20px"><h2>📈 Viral Growth</h2>
<span class="more">Вирусный рост</span></div>
<section class="neo-vg">
<div class="neo-vg-grid">
<div class="neo-vg-card"><h3>Organic Growth</h3><span class="neo-vg-value">2x</span><p>Month over month</p></div>
<div class="neo-vg-card"><h3>Referral Rate</h3><span class="neo-vg-value">30%</span><p>Of new users</p></div>
<div class="neo-vg-card"><h3>Leaderboard</h3><span class="neo-vg-status active">Active</span><p>Gamification</p></div>
</div></section></div></main>{{ partial "neo-footer.html" . }}
<style>.neo-vg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin:2rem 0}.neo-vg-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1.5rem;text-align:center}.neo-vg-card h3{margin-bottom:.5rem}.neo-vg-status{display:inline-block;padding:.2rem .6rem;border-radius:999px;font-size:.75rem;background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent);margin-bottom:.5rem}.neo-vg-value{font-size:1.5rem;font-weight:700}.neo-vg-card p{color:var(--muted);font-size:.85rem}</style>
</body></html>

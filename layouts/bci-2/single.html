{{/* BCI 2.0 */}}
<!DOCTYPE html><html lang="ru" data-theme="dark">{{ partial "neo-head.html" . }}<body>
{{ partial "neo-header.html" . }}<main class="neo" id="main"><div class="neo-wrap">
<div class="neo-sec-head" style="margin-top:20px"><h2>🧠 BCI 2.0</h2>
<span class="more">Полноценный интерфейс мозг-компьютер</span></div>
<section class="neo-bci2">
<div class="neo-bci2-grid">
<div class="neo-bci2-card"><h3>Neural Navigation</h3><span class="neo-bci2-status beta">Beta</span><p>Navigate with thoughts</p></div>
<div class="neo-bci2-card"><h3>Focus Detection</h3><span class="neo-bci2-status active">Active</span><p>Real-time</p></div>
<div class="neo-bci2-card"><h3>Thought-to-Text</h3><span class="neo-bci2-status planned">Planned</span><p>Coming soon</p></div>
</div></section></div></main>{{ partial "neo-footer.html" . }}
<style>.neo-bci2-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin:2rem 0}.neo-bci2-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1.5rem;text-align:center}.neo-bci2-card h3{margin-bottom:.5rem}.neo-bci2-status{display:inline-block;padding:.2rem .6rem;border-radius:999px;font-size:.75rem;margin-bottom:.5rem}.neo-bci2-status.active{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}.neo-bci2-status.beta{background:color-mix(in srgb,var(--violet) 20%,transparent);color:var(--violet)}.neo-bci2-status.planned{background:var(--line);color:var(--muted)}.neo-bci2-card p{color:var(--muted);font-size:.85rem}</style>
</body></html>

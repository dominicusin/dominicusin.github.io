{{/* DAO Governance dApp — Preact + ethers.js SPA embedded in Hugo. */}}
<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode | default "ru" }}" data-theme="dark">
{{ partial "neo-head.html" . }}
<body>
{{ partial "neo-header.html" . }}
<main class="neo" id="main">
<div class="neo-wrap">
  <div class="neo-sec-head" style="margin-top:20px"><h2>🏛 DAO Governance</h2>
    <span class="more">Decentralized decision making</span>
  </div>

  <div id="dao-app">
    <div class="neo-dao-loading">Loading...</div>
  </div>
</div>
</main>
{{ partial "neo-footer.html" . }}

<!-- Preact + htm (no build step) -->
<script type="module">
import { h, render, useState, useEffect, useCallback } from 'https://esm.sh/preact@10.24.0';
import htm from 'https://esm.sh/htm@3.1.1';
import { ethers } from 'https://esm.sh/ethers@6.13.0';

const html = htm.bind(h);

// Contract addresses (Sepolia testnet — update after deploy)
const TOKEN_ADDR = '{{ site.Params.daoTokenAddress }}';
const ENGINE_ADDR = '{{ site.Params.daoEngineAddress }}';

const TOKEN_ABI = [
  'function balanceOf(address) view returns (uint256)',
  'function delegate(address)',
  'function getVotes(address) view returns (uint256)',
  'function name() view returns (string)',
  'function symbol() view returns (string)',
  'function totalSupply() view returns (uint256)'
];

const ENGINE_ABI = [
  'function proposalCount() view returns (uint256)',
  'function proposals(uint256) view returns (uint256 id, address proposer, string description, uint256 forVotes, uint256 againstVotes, uint256 startBlock, uint256 endBlock, bool executed)',
  'function vote(uint256 proposalId, bool support)',
  'function execute(uint256 proposalId)',
  'function hasVoted(uint256, address) view returns (bool)',
  'function state(uint256) view returns (uint8)'
];

function useWallet() {
  const [provider, setProvider] = useState(null);
  const [signer, setSigner] = useState(null);
  const [address, setAddress] = useState(null);
  const [chainId, setChainId] = useState(null);
  const [error, setError] = useState(null);

  const connect = useCallback(async () => {
    try {
      if (!window.ethereum) {
        setError('No wallet detected. Install MetaMask or WalletConnect.');
        return;
      }
      const provider = new ethers.BrowserProvider(window.ethereum);
      const accounts = await provider.send('eth_requestAccounts', []);
      const signer = await provider.getSigner();
      const network = await provider.getNetwork();
      setProvider(provider);
      setSigner(signer);
      setAddress(accounts[0]);
      setChainId(Number(network.chainId));
      setError(null);
    } catch (err) {
      setError(err.message);
    }
  }, []);

  const disconnect = useCallback(() => {
    setProvider(null);
    setSigner(null);
    setAddress(null);
    setChainId(null);
  }, []);

  return { provider, signer, address, chainId, error, connect, disconnect };
}

function useToken(provider, address) {
  const [balance, setBalance] = useState('0');
  const [votes, setVotes] = useState('0');
  const [symbol, setSymbol] = useState('');
  const [totalSupply, setTotalSupply] = useState('0');

  useEffect(() => {
    if (!provider || !address || !TOKEN_ADDR) return;
    const token = new ethers.Contract(TOKEN_ADDR, TOKEN_ABI, provider);
    Promise.all([
      token.balanceOf(address),
      token.getVotes(address),
      token.symbol(),
      token.totalSupply()
    ]).then(([b, v, s, ts]) => {
      setBalance(ethers.formatEther(b));
      setVotes(ethers.formatEther(v));
      setSymbol(s);
      setTotalSupply(ethers.formatEther(ts));
    }).catch(() => {});
  }, [provider, address]);

  return { balance, votes, symbol, totalSupply };
}

function ProposalCard({ proposal, onVote, onExecute, provider, address }) {
  const { id, proposer, description, forVotes, againstVotes, startBlock, endBlock, executed } = proposal;
  const total = Number(ethers.formatEther(forVotes)) + Number(ethers.formatEther(againstVotes));
  const forPct = total > 0 ? (Number(ethers.formatEther(forVotes)) / total * 100).toFixed(1) : 0;
  const againstPct = total > 0 ? (Number(ethers.formatEther(againstVotes)) / total * 100).toFixed(1) : 0;

  return html`
    <div class="neo-dao-proposal">
      <div class="neo-dao-proposal-head">
        <span class="neo-dao-proposal-id">#${Number(id)}</span>
        <span class="neo-dao-proposal-status ${executed ? 'executed' : 'active'}">
          ${executed ? 'Executed' : 'Active'}
        </span>
      </div>
      <p class="neo-dao-proposal-desc">${description}</p>
      <div class="neo-dao-proposal-meta">
        <span>Proposer: ${proposer.slice(0, 6)}...${proposer.slice(-4)}</span>
        <span>End: Block ${Number(endBlock)}</span>
      </div>
      <div class="neo-dao-votes">
        <div class="neo-dao-vote-bar">
          <div class="neo-dao-vote-for" style="width:${forPct}%"></div>
          <div class="neo-dao-vote-against" style="width:${againstPct}%"></div>
        </div>
        <div class="neo-dao-vote-labels">
          <span class="neo-dao-vote-for-label">For: ${forPct}%</span>
          <span class="neo-dao-vote-against-label">Against: ${againstPct}%</span>
        </div>
      </div>
      ${!executed && html`
        <div class="neo-dao-proposal-actions">
          <button class="neo-btn neo-btn-primary" onClick=${() => onVote(id, true)}>Vote For</button>
          <button class="neo-btn" onClick=${() => onVote(id, false)}>Vote Against</button>
          <button class="neo-btn" onClick=${() => onExecute(id)}>Execute</button>
        </div>
      `}
    </div>
  `;
}

function DAOApp({ provider, signer, address, connect, error: walletError }) {
  const [proposals, setProposals] = useState([]);
  const [loading, setLoading] = useState(true);
  const [txPending, setTxPending] = useState(false);
  const [newProposalDesc, setNewProposalDesc] = useState('');
  const { balance, votes, symbol, totalSupply } = useToken(provider, address);

  const loadProposals = useCallback(async () => {
    if (!provider || !ENGINE_ADDR) return;
    try {
      const engine = new ethers.Contract(ENGINE_ADDR, ENGINE_ABI, provider);
      const count = await engine.proposalCount();
      const items = [];
      for (let i = 1; i <= Number(count); i++) {
        const p = await engine.proposals(i);
        items.push(p);
      }
      setProposals(items);
    } catch (err) {
      console.error('Failed to load proposals:', err);
    }
    setLoading(false);
  }, [provider]);

  useEffect(() => { loadProposals(); }, [loadProposals]);

  const handleVote = async (id, support) => {
    if (!signer) return;
    setTxPending(true);
    try {
      const engine = new ethers.Contract(ENGINE_ADDR, ENGINE_ABI, signer);
      const tx = await engine.vote(id, support);
      await tx.wait();
      await loadProposals();
    } catch (err) {
      alert('Vote failed: ' + err.message);
    }
    setTxPending(false);
  };

  const handleExecute = async (id) => {
    if (!signer) return;
    setTxPending(true);
    try {
      const engine = new ethers.Contract(ENGINE_ADDR, ENGINE_ABI, signer);
      const tx = await engine.execute(id);
      await tx.wait();
      await loadProposals();
    } catch (err) {
      alert('Execute failed: ' + err.message);
    }
    setTxPending(false);
  };

  const handlePropose = async () => {
    if (!signer || !newProposalDesc) return;
    setTxPending(true);
    try {
      const engine = new ethers.Contract(ENGINE_ADDR, ENGINE_ABI, signer);
      const tx = await engine.propose(newProposalDesc);
      await tx.wait();
      setNewProposalDesc('');
      await loadProposals();
    } catch (err) {
      alert('Propose failed: ' + err.message);
    }
    setTxPending(false);
  };

  if (!provider) {
    return html`
      <div class="neo-dao-connect">
        <h3>Connect Wallet</h3>
        <p>Connect your wallet to participate in governance</p>
        <button class="neo-btn neo-btn-primary" onClick=${connect}>Connect Wallet</button>
        ${walletError && html`<p class="neo-dao-error">${walletError}</p>`}
      </div>
    `;
  }

  return html`
    <div class="neo-dao-dashboard">
      <div class="neo-dao-stats">
        <div class="neo-dao-stat">
          <span class="neo-dao-stat-label">Balance</span>
          <span class="neo-dao-stat-value">${Number(balance).toFixed(2)} ${symbol}</span>
        </div>
        <div class="neo-dao-stat">
          <span class="neo-dao-stat-label">Voting Power</span>
          <span class="neo-dao-stat-value">${Number(votes).toFixed(2)}</span>
        </div>
        <div class="neo-dao-stat">
          <span class="neo-dao-stat-label">Total Supply</span>
          <span class="neo-dao-stat-value">${Number(totalSupply).toFixed(0)} ${symbol}</span>
        </div>
        <div class="neo-dao-stat">
          <span class="neo-dao-stat-label">Proposals</span>
          <span class="neo-dao-stat-value">${proposals.length}</span>
        </div>
      </div>

      <div class="neo-dao-propose">
        <h3>Create Proposal</h3>
        <textarea
          placeholder="Describe your proposal..."
          value=${newProposalDesc}
          onInput=${(e) => setNewProposalDesc(e.target.value)}
        ></textarea>
        <button class="neo-btn neo-btn-primary" onClick=${handlePropose} disabled=${txPending}>
          ${txPending ? 'Submitting...' : 'Submit Proposal'}
        </button>
      </div>

      <div class="neo-dao-proposals">
        <h3>Proposals</h3>
        ${loading
          ? html`<div class="neo-dao-loading">Loading proposals...</div>`
          : proposals.length === 0
            ? html`<p>No proposals yet</p>`
            : proposals.map(p => html`
              <${ProposalCard}
                key=${p.id}
                proposal=${p}
                onVote=${handleVote}
                onExecute=${handleExecute}
                provider=${provider}
                address=${address}
              />
            `)
        }
      </div>
    </div>
  `;
}

function App() {
  const wallet = useWallet();
  return html`<${DAOApp} ...${wallet} />`;
}

// Mount
const root = document.getElementById('dao-app');
if (root) render(h(App), root);
</script>

<style>
.neo-dao-loading{text-align:center;padding:2rem;color:var(--muted)}
.neo-dao-connect{text-align:center;padding:3rem}
.neo-dao-connect h3{margin-bottom:.5rem}
.neo-dao-connect p{color:var(--muted);margin-bottom:1rem}
.neo-dao-error{color:#fb7185;margin-top:.5rem}
.neo-dao-dashboard{display:flex;flex-direction:column;gap:1.5rem}
.neo-dao-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1rem}
.neo-dao-stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1rem;text-align:center}
.neo-dao-stat-label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:.3rem}
.neo-dao-stat-value{display:block;font-size:1.1rem;font-weight:700}
.neo-dao-propose{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1rem}
.neo-dao-propose h3{margin-bottom:.5rem}
.neo-dao-propose textarea{width:100%;min-height:80px;padding:.5rem;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);margin-bottom:.5rem;resize:vertical}
.neo-dao-proposals{display:flex;flex-direction:column;gap:1rem}
.neo-dao-proposals h3{margin-bottom:.5rem}
.neo-dao-proposal{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1rem}
.neo-dao-proposal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}
.neo-dao-proposal-id{font-weight:700;color:var(--accent)}
.neo-dao-proposal-status{font-size:.75rem;padding:.15rem .5rem;border-radius:999px}
.neo-dao-proposal-status.active{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}
.neo-dao-proposal-status.executed{background:color-mix(in srgb,var(--muted) 20%,transparent);color:var(--muted)}
.neo-dao-proposal-desc{margin:.5rem 0;color:var(--text)}
.neo-dao-proposal-meta{display:flex;gap:1rem;font-size:.75rem;color:var(--muted);margin-bottom:.5rem}
.neo-dao-votes{margin:.5rem 0}
.neo-dao-vote-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--panel-2)}
.neo-dao-vote-for{background:var(--accent)}
.neo-dao-vote-against{background:#fb7185}
.neo-dao-vote-labels{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);margin-top:.2rem}
.neo-dao-proposal-actions{display:flex;gap:.5rem;margin-top:.5rem;flex-wrap:wrap}
</style>
</body>
</html>

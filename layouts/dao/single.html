{{/* DAO Governance 2.0 — full on-chain governance UI. */}}
<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode | default "ru" }}" data-theme="dark">
{{ partial "neo-head.html" . }}
<body>
{{ partial "neo-header.html" . }}
<main class="neo" id="main">
<div class="neo-wrap">
  <div class="neo-sec-head" style="margin-top:20px"><h2>🏛 DAO Governance 2.0</h2>
    <span class="more">On-chain proposals, voting, delegation</span>
  </div>

  <div id="dao-app">
    <div class="dao-loading">Loading...</div>
  </div>
</div>
</main>
{{ partial "neo-footer.html" . }}

<script type="module">
import { h, render, useState, useEffect, useCallback, useRef } from 'https://esm.sh/preact@10.24.0';
import htm from 'https://esm.sh/htm@3.1.1';
import { ethers } from 'https://esm.sh/ethers@6.13.0';

const html = htm.bind(h);

const TOKEN_ADDR = '{{ site.Params.daoTokenAddress }}';
const ENGINE_ADDR = '{{ site.Params.daoEngineAddress }}';

const TOKEN_ABI = [
  'function balanceOf(address) view returns (uint256)',
  'function getCurrentVotes(address) view returns (uint256)',
  'function delegates(address) view returns (address)',
  'function delegate(address)',
  'function name() view returns (string)',
  'function symbol() view returns (string)',
  'function totalSupply() view returns (uint256)',
  'function approve(address,uint256) returns (bool)',
  'function transfer(address,uint256) returns (bool)'
];

const ENGINE_ABI = [
  'function proposalCount() view returns (uint256)',
  'function proposals(uint256) view returns (uint256 id, address proposer, string description, bytes32 ipfsHash, uint256 forVotes, uint256 againstVotes, uint256 startBlock, uint256 endBlock, uint256 executeAfter, bool executed, bool canceled)',
  'function state(uint256) view returns (uint8)',
  'function propose(string,bytes32) returns (uint256)',
  'function castVote(uint256,bool)',
  'function queue(uint256)',
  'function execute(uint256)',
  'function cancel(uint256)',
  'function hasVoted(uint256,address) view returns (bool)',
  'function PROPOSAL_THRESHOLD() view returns (uint256)',
  'function VOTING_PERIOD() view returns (uint256)',
  'function TIMELOCK_DELAY() view returns (uint256)',
  'function QUORUM_BPS() view returns (uint256)'
];

function DAOApp() {
  const [provider, setProvider] = useState(null);
  const [signer, setSigner] = useState(null);
  const [address, setAddress] = useState(null);
  const [chainId, setChainId] = useState(null);
  const [balance, setBalance] = useState('0');
  const [votes, setVotes] = useState('0');
  const [delegated, setDelegated] = useState(null);
  const [proposals, setProposals] = useState([]);
  const [loading, setLoading] = useState(true);
  const [txPending, setTxPending] = useState(false);
  const [newProposal, setNewProposal] = useState({ description: '', ipfsHash: '' });
  const [delegateTo, setDelegateTo] = useState('');
  const [error, setError] = useState(null);
  const [activeTab, setActiveTab] = useState('proposals');

  const connect = useCallback(async () => {
    try {
      if (!window.ethereum) {
        setError('No wallet detected');
        return;
      }
      const provider = new ethers.BrowserProvider(window.ethereum);
      const accounts = await provider.send('eth_requestAccounts', []);
      const signer = await provider.getSigner();
      const network = await provider.getNetwork();
      setProvider(provider);
      setSigner(signer);
      setAddress(accounts[0]);
      setChainId(Number(network.chainId));
      setError(null);
    } catch (err) {
      setError(err.message);
    }
  }, []);

  const disconnect = useCallback(() => {
    setProvider(null);
    setSigner(null);
    setAddress(null);
    setChainId(null);
    setBalance('0');
    setVotes('0');
  }, []);

  const loadData = useCallback(async () => {
    if (!provider || !address || !ENGINE_ADDR) return;
    try {
      const token = new ethers.Contract(TOKEN_ADDR, TOKEN_ABI, provider);
      const engine = new ethers.Contract(ENGINE_ADDR, ENGINE_ABI, provider);

      const [b, v, d, count] = await Promise.all([
        token.balanceOf(address),
        token.getCurrentVotes(address),
        token.delegates(address),
        engine.proposalCount()
      ]);

      setBalance(ethers.formatEther(b));
      setVotes(ethers.formatEther(v));
      setDelegated(d);

      const items = [];
      for (let i = 1; i <= Number(count); i++) {
        const p = await engine.proposals(i);
        const st = await engine.state(i);
        items.push({ ...p, state: Number(st) });
      }
      setProposals(items);
    } catch (err) {
      console.error('Load error:', err);
    }
    setLoading(false);
  }, [provider, address]);

  useEffect(() => { loadData(); }, [loadData]);

  const handleVote = async (id, support) => {
    if (!signer) return;
    setTxPending(true);
    try {
      const engine = new ethers.Contract(ENGINE_ADDR, ENGINE_ABI, signer);
      const tx = await engine.castVote(id, support);
      await tx.wait();
      await loadData();
    } catch (err) {
      alert('Vote failed: ' + err.message);
    }
    setTxPending(false);
  };

  const handleExecute = async (id) => {
    if (!signer) return;
    setTxPending(true);
    try {
      const engine = new ethers.Contract(ENGINE_ADDR, ENGINE_ABI, signer);
      const tx = await engine.execute(id);
      await tx.wait();
      await loadData();
    } catch (err) {
      alert('Execute failed: ' + err.message);
    }
    setTxPending(false);
  };

  const handlePropose = async () => {
    if (!signer || !newProposal.description) return;
    setTxPending(true);
    try {
      const engine = new ethers.Contract(ENGINE_ADDR, ENGINE_ABI, signer);
      const ipfsHash = newProposal.ipfsHash ? ethers.encodeBytes32String(newProposal.ipfsHash) : ethers.ZeroHash;
      const tx = await engine.propose(newProposal.description, ipfsHash);
      await tx.wait();
      setNewProposal({ description: '', ipfsHash: '' });
      await loadData();
    } catch (err) {
      alert('Propose failed: ' + err.message);
    }
    setTxPending(false);
  };

  const handleDelegate = async () => {
    if (!signer || !delegateTo) return;
    setTxPending(true);
    try {
      const token = new ethers.Contract(TOKEN_ADDR, TOKEN_ABI, signer);
      const tx = await token.delegate(delegateTo);
      await tx.wait();
      await loadData();
    } catch (err) {
      alert('Delegate failed: ' + err.message);
    }
    setTxPending(false);
  };

  const stateNames = ['Pending', 'Active', 'Succeeded', 'Queued', 'Executed', 'Defeated', 'Canceled'];

  if (!provider) {
    return html`
      <div class="dao-connect">
        <h3>Connect Wallet</h3>
        <p>Connect your wallet to participate in governance</p>
        <button class="neo-btn neo-btn-primary" onClick=${connect}>Connect Wallet</button>
        ${error && html`<p class="dao-error">${error}</p>`}
      </div>
    `;
  }

  return html`
    <div class="dao-dashboard">
      <div class="dao-stats">
        <div class="dao-stat"><span class="dao-stat-label">Balance</span><span class="dao-stat-value">${Number(balance).toFixed(2)} KNOW</span></div>
        <div class="dao-stat"><span class="dao-stat-label">Voting Power</span><span class="dao-stat-value">${Number(votes).toFixed(2)}</span></div>
        <div class="dao-stat"><span class="dao-stat-label">Delegated To</span><span class="dao-stat-value">${delegated ? delegated.slice(0,6) + '...' + delegated.slice(-4) : 'Self'}</span></div>
        <div class="dao-stat"><span class="dao-stat-label">Proposals</span><span class="dao-stat-value">${proposals.length}</span></div>
      </div>

      <div class="dao-tabs">
        <button class=${activeTab === 'proposals' ? 'active' : ''} onClick=${() => setActiveTab('proposals')}>Proposals</button>
        <button class=${activeTab === 'create' ? 'active' : ''} onClick=${() => setActiveTab('create')}>Create</button>
        <button class=${activeTab === 'delegate' ? 'active' : ''} onClick=${() => setActiveTab('delegate')}>Delegate</button>
      </div>

      ${activeTab === 'proposals' && html`
        <div class="dao-proposals">
          ${loading
            ? html`<div class="dao-loading">Loading...</div>`
            : proposals.length === 0
              ? html`<p>No proposals yet</p>`
              : proposals.map(p => {
                  const total = Number(ethers.formatEther(p.forVotes)) + Number(ethers.formatEther(p.againstVotes));
                  const forPct = total > 0 ? (Number(ethers.formatEther(p.forVotes)) / total * 100).toFixed(1) : 0;
                  return html`
                    <div class="dao-proposal" key=${p.id}>
                      <div class="dao-proposal-head">
                        <span class="dao-proposal-id">#${Number(p.id)}</span>
                        <span class="dao-proposal-state state-${p.state}">${stateNames[p.state]}</span>
                      </div>
                      <p class="dao-proposal-desc">${p.description}</p>
                      <div class="dao-proposal-meta">
                        <span>Proposer: ${p.proposer.slice(0,6)}...${p.proposer.slice(-4)}</span>
                        <span>End: ${new Date(Number(p.endBlock) * 1000).toLocaleDateString()}</span>
                      </div>
                      <div class="dao-vote-bar">
                        <div class="dao-vote-for" style="width:${forPct}%"></div>
                        <div class="dao-vote-against" style="width:${100 - forPct}%"></div>
                      </div>
                      <div class="dao-vote-labels">
                        <span>For: ${forPct}%</span>
                        <span>Against: ${(100 - forPct).toFixed(1)}%</span>
                      </div>
                      ${p.state === 1 && html`
                        <div class="dao-proposal-actions">
                          <button class="neo-btn neo-btn-primary" onClick=${() => handleVote(Number(p.id), true)} disabled=${txPending}>Vote For</button>
                          <button class="neo-btn" onClick=${() => handleVote(Number(p.id), false)} disabled=${txPending}>Vote Against</button>
                        </div>
                      `}
                      ${p.state === 2 && html`
                        <div class="dao-proposal-actions">
                          <button class="neo-btn" onClick=${() => handleExecute(Number(p.id))} disabled=${txPending}>Queue</button>
                        </div>
                      `}
                      ${p.state === 3 && html`
                        <div class="dao-proposal-actions">
                          <button class="neo-btn neo-btn-primary" onClick=${() => handleExecute(Number(p.id))} disabled=${txPending}>Execute</button>
                        </div>
                      `}
                    </div>
                  `;
                })
          }
        </div>
      `}

      ${activeTab === 'create' && html`
        <div class="dao-create">
          <h3>Create Proposal</h3>
          <p class="dao-hint">Minimum 100 KNOW required to propose</p>
          <textarea placeholder="Proposal description..." value=${newProposal.description} onInput=${e => setNewProposal(p => ({ ...p, description: e.target.value }))} rows="4"></textarea>
          <input type="text" placeholder="IPFS hash (optional)" value=${newProposal.ipfsHash} onInput=${e => setNewProposal(p => ({ ...p, ipfsHash: e.target.value }))} />
          <button class="neo-btn neo-btn-primary" onClick=${handlePropose} disabled=${txPending}>Submit Proposal</button>
        </div>
      `}

      ${activeTab === 'delegate' && html`
        <div class="dao-delegate">
          <h3>Delegate Votes</h3>
          <p class="dao-hint">Delegate your voting power to another address</p>
          <input type="text" placeholder="Address (0x...)" value=${delegateTo} onInput=${e => setDelegateTo(e.target.value)} />
          <button class="neo-btn neo-btn-primary" onClick=${handleDelegate} disabled=${txPending}>Delegate</button>
        </div>
      `}
    </div>
  `;
}

function App() {
  return html`<${DAOApp} />`;
}

const root = document.getElementById('dao-app');
if (root) render(h(App), root);
</script>

<style>
.dao-loading{text-align:center;padding:2rem;color:var(--muted)}
.dao-connect{text-align:center;padding:3rem}
.dao-connect h3{margin-bottom:.5rem}
.dao-connect p{color:var(--muted);margin-bottom:1rem}
.dao-error{color:#fb7185;margin-top:.5rem}
.dao-dashboard{display:flex;flex-direction:column;gap:1.5rem}
.dao-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1rem}
.dao-stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1rem;text-align:center}
.dao-stat-label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:.3rem}
.dao-stat-value{display:block;font-size:1.1rem;font-weight:700}
.dao-tabs{display:flex;gap:.5rem;border-bottom:1px solid var(--line);padding-bottom:.5rem}
.dao-tabs button{padding:.5rem 1rem;border:none;background:transparent;color:var(--muted);cursor:pointer;border-radius:8px}
.dao-tabs button.active{background:var(--panel);color:var(--accent)}
.dao-proposals{display:flex;flex-direction:column;gap:1rem}
.dao-proposal{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1rem}
.dao-proposal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}
.dao-proposal-id{font-weight:700;color:var(--accent)}
.dao-proposal-state{font-size:.75rem;padding:.15rem .5rem;border-radius:999px}
.dao-proposal-state.state-1{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}
.dao-proposal-state.state-2{background:color-mix(in srgb,var(--green,#22c55e) 20%,transparent);color:var(--green,#22c55e)}
.dao-proposal-state.state-4{background:color-mix(in srgb,var(--red,#ef4444) 20%,transparent);color:var(--red,#ef4444)}
.dao-proposal-state.state-3{background:color-mix(in srgb,var(--amber) 20%,transparent);color:var(--amber)}
.dao-proposal-state.state-0,.dao-proposal-state.state-5,.dao-proposal-state.state-6{background:var(--line);color:var(--muted)}
.dao-proposal-desc{margin:.5rem 0;color:var(--text)}
.dao-proposal-meta{display:flex;gap:1rem;font-size:.75rem;color:var(--muted);margin-bottom:.5rem}
.dao-vote-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--panel-2)}
.dao-vote-for{background:var(--green,#22c55e)}
.dao-vote-against{background:var(--red,#ef4444)}
.dao-vote-labels{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);margin-top:.2rem}
.dao-proposal-actions{display:flex;gap:.5rem;margin-top:.5rem}
.dao-create,.dao-delegate{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1.5rem}
.dao-create h3,.dao-delegate h3{margin-bottom:.5rem}
.dao-hint{font-size:.8rem;color:var(--muted);margin-bottom:1rem}
.dao-create textarea,.dao-create input,.dao-delegate input{width:100%;padding:.6rem;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);margin-bottom:.5rem;font-family:var(--font)}
.dao-create textarea{resize:vertical}
</style>
</body>
</html>

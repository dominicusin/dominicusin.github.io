{{/* Global Community */}}
<!DOCTYPE html><html lang="ru" data-theme="dark">{{ partial "neo-head.html" . }}<body>
{{ partial "neo-header.html" . }}<main class="neo" id="main"><div class="neo-wrap">
<div class="neo-sec-head" style="margin-top:20px"><h2>🌍 Global Community</h2>
<span class="more">Сообщество по всему миру</span></div>
<section class="neo-gc">
<div class="neo-gc-grid">
<div class="neo-gc-card"><h3>Languages</h3><span class="neo-gc-value">20+</span><p>Localized</p></div>
<div class="neo-gc-card"><h3>Regional Hubs</h3><span class="neo-gc-value">10+</span><p>Active</p></div>
<div class="neo-gc-card"><h3>Local Events</h3><span class="neo-gc-value">100+</span><p>This year</p></div>
</div></section></div></main>{{ partial "neo-footer.html" . }}
<style>.neo-gc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin:2rem 0}.neo-gc-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1.5rem;text-align:center}.neo-gc-card h3{margin-bottom:.5rem}.neo-gc-value{font-size:1.5rem;font-weight:700}.neo-gc-card p{color:var(--muted);font-size:.85rem}</style>
</body></html>

{{/* Digital Twin */}}
<!DOCTYPE html><html lang="ru" data-theme="dark">{{ partial "neo-head.html" . }}<body>
{{ partial "neo-header.html" . }}<main class="neo" id="main"><div class="neo-wrap">
<div class="neo-sec-head" style="margin-top:20px"><h2>👤 Digital Twin</h2>
<span class="more">Цифровой двойник пользователя</span></div>
<section class="neo-dt">
<div class="neo-dt-grid">
<div class="neo-dt-card"><h3>Personal Avatar</h3><span class="neo-dt-status active">Active</span><p>3D model</p></div>
<div class="neo-dt-card"><h3>Behavior Model</h3><span class="neo-dt-status active">Active</span><p>Learning</p></div>
<div class="neo-dt-card"><h3>Predictive Assistance</h3><span class="neo-dt-status beta">Beta</span><p>AI-powered</p></div>
</div></section></div></main>{{ partial "neo-footer.html" . }}
<style>.neo-dt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin:2rem 0}.neo-dt-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1.5rem;text-align:center}.neo-dt-card h3{margin-bottom:.5rem}.neo-dt-status{display:inline-block;padding:.2rem .6rem;border-radius:999px;font-size:.75rem;margin-bottom:.5rem}.neo-dt-status.active{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}.neo-dt-status.beta{background:color-mix(in srgb,var(--violet) 20%,transparent);color:var(--violet)}.neo-dt-card p{color:var(--muted);font-size:.85rem}</style>
</body></html>

{{/* Multi-Region Database */}}
<!DOCTYPE html><html lang="ru" data-theme="dark">{{ partial "neo-head.html" . }}<body>
{{ partial "neo-header.html" . }}<main class="neo" id="main"><div class="neo-wrap">
<div class="neo-sec-head" style="margin-top:20px"><h2>🗄 Multi-Region DB</h2>
<span class="more">Геораспределённая база данных</span></div>
<section class="neo-mrd">
<div class="neo-mrd-grid">
<div class="neo-mrd-card"><h3>Regions</h3><span class="neo-mrd-value">5</span><p>Active</p></div>
<div class="neo-mrd-card"><h3>Read Latency</h3><span class="neo-mrd-value">&lt;100ms</span><p>Average</p></div>
<div class="neo-mrd-card"><h3>Failover</h3><span class="neo-mrd-status active">Auto</span><p>&lt; 30s</p></div>
</div></section></div></main>{{ partial "neo-footer.html" . }}
<style>.neo-mrd-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin:2rem 0}.neo-mrd-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1.5rem;text-align:center}.neo-mrd-card h3{margin-bottom:.5rem}.neo-mrd-status{display:inline-block;padding:.2rem .6rem;border-radius:999px;font-size:.75rem;background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent);margin-bottom:.5rem}.neo-mrd-value{font-size:1.5rem;font-weight:700}.neo-mrd-card p{color:var(--muted);font-size:.85rem}</style>
</body></html>

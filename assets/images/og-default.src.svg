<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Inter','Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c6cf0"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- brand mark -->
  <rect x="80" y="80" width="14" height="120" rx="7" fill="url(#accent)"/>
  <text x="120" y="172" fill="#e2e8f0" font-size="34" font-weight="600" letter-spacing="2">DOMINICUS&#160;IN</text>
  <!-- title -->
  <text x="80" y="330" fill="#f8fafc" font-size="92" font-weight="800">Engineering</text>
  <text x="80" y="424" fill="#f8fafc" font-size="92" font-weight="800">blog <tspan fill="#7c6cf0">&amp;</tspan> decentralized web</text>
  <!-- tagline -->
  <text x="82" y="500" fill="#94a3b8" font-size="34" font-weight="500">Notes on systems, NixOS/Guix, and the open web.</text>
  <!-- footer rule -->
  <rect x="80" y="546" width="220" height="6" rx="3" fill="url(#accent)"/>
  <text x="80" y="588" fill="#64748b" font-size="24" font-weight="500">dominicusin.github.io</text>
</svg>

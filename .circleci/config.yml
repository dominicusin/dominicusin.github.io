version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:24.0
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - run:
          name: Lint
          command: npm run lint || true

workflows:
  build-and-test:
    jobs:
      - build
